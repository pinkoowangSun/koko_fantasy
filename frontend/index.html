<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koko</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #F6F5F2;
    }
    .login-card {
      background: #fff;
      border: 1px solid #E8E7E3;
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 2px 24px rgba(0,0,0,0.06);
    }
    .login-wordmark {
      font-size: 22px;
      font-weight: 600;
      color: #1A1917;
      letter-spacing: -0.4px;
      margin-bottom: 6px;
    }
    .login-tagline {
      font-size: 14px;
      color: #78776E;
      margin-bottom: 32px;
    }
    .login-footer {
      font-size: 12px;
      color: #ABAAA5;
      margin-top: 24px;
      line-height: 1.6;
    }
    .login-error {
      margin-top: 16px;
      font-size: 13px;
      color: #DC2626;
      background: #FEF2F2;
      border: 1px solid #FCA5A5;
      border-radius: 8px;
      padding: 9px 12px;
    }
    #telegram-login-wrap { display: flex; justify-content: center; }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
  <div x-data="loginPage()" x-init="init()">
    <div class="login-card">
      <div style="margin-bottom:14px">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="52" height="52">
          <path d="M24 42S4 29.4 4 16.5C4 10.2 9.1 5 15.5 5c3.7 0 7 1.8 9.5 4.6C27.5 6.8 30.8 5 34.5 5 40.9 5 46 10.2 46 16.5 46 29.4 24 42 24 42z" fill="#93C5FD"/>
        </svg>
      </div>
      <div class="login-wordmark">Koko</div>
      <p class="login-tagline">Your personal life assistant</p>

      <div id="telegram-login-wrap"></div>

      <p class="login-footer">
        Sign in with Telegram to continue.<br />
        Your data is stored privately on your server.
      </p>

      <template x-if="error">
        <p class="login-error" x-text="error"></p>
      </template>
    </div>
  </div>

  <script>
    async function onTelegramAuth(user) {
      try {
        const resp = await fetch('/api/auth/telegram', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(user),
        });
        if (!resp.ok) throw new Error('Auth failed');
        const data = await resp.json();
        localStorage.setItem('koko_token', data.token);
        window.location.href = '/dashboard';
      } catch (e) {
        const el = document.querySelector('[x-data]');
        if (el && el._x_dataStack) el._x_dataStack[0].error = 'Login failed. Please try again.';
      }
    }

    function loginPage() {
      return {
        error: null,
        async init() {
          if (localStorage.getItem('koko_token')) {
            window.location.href = '/dashboard';
            return;
          }
          try {
            const cfg = await fetch('/api/config').then(r => r.json());
            if (!cfg.telegram_bot_username) {
              this.error = 'TELEGRAM_BOT_USERNAME not configured on server.';
              return;
            }
            const s = document.createElement('script');
            s.async = true;
            s.src = 'https://telegram.org/js/telegram-widget.js?22';
            s.setAttribute('data-telegram-login', cfg.telegram_bot_username);
            s.setAttribute('data-size', 'large');
            s.setAttribute('data-onauth', 'onTelegramAuth(user)');
            s.setAttribute('data-request-access', 'write');
            document.getElementById('telegram-login-wrap').appendChild(s);
          } catch (e) {
            this.error = 'Could not reach server.';
          }
        },
      };
    }
  </script>
</body>
</html>
