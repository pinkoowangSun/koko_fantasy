<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koko</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #F6F5F2;
    }
    .login-card {
      background: #fff;
      border: 1px solid #E8E7E3;
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 2px 24px rgba(0,0,0,0.06);
    }
    .login-wordmark {
      font-size: 22px;
      font-weight: 600;
      color: #1A1917;
      letter-spacing: -0.4px;
      margin-bottom: 6px;
    }
    .login-tagline {
      font-size: 14px;
      color: #78776E;
      margin-bottom: 32px;
    }
    .login-footer {
      font-size: 12px;
      color: #ABAAA5;
      margin-top: 24px;
      line-height: 1.6;
    }
    .login-error {
      margin-top: 16px;
      font-size: 13px;
      color: #DC2626;
      background: #FEF2F2;
      border: 1px solid #FCA5A5;
      border-radius: 8px;
      padding: 9px 12px;
    }
    .pending-box {
      margin-top: 24px;
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      border-radius: 12px;
      padding: 20px 16px;
    }
    .pending-box h3 {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 600;
      color: #92400E;
    }
    .pending-box p {
      margin: 0;
      font-size: 13px;
      color: #78350F;
      line-height: 1.5;
    }
    .rejected-box {
      margin-top: 24px;
      background: #FEF2F2;
      border: 1px solid #FCA5A5;
      border-radius: 12px;
      padding: 20px 16px;
    }
    .rejected-box h3 {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 600;
      color: #991B1B;
    }
    .rejected-box p {
      margin: 0 0 14px;
      font-size: 13px;
      color: #7F1D1D;
      line-height: 1.5;
    }
    .btn-reapply {
      background: #1A1917;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-reapply:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-signout {
      margin-top: 16px;
      background: none;
      border: none;
      font-size: 12px;
      color: #ABAAA5;
      cursor: pointer;
      text-decoration: underline;
    }
    #telegram-login-wrap { display: flex; justify-content: center; }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
  <div x-data="loginPage()" x-init="init()">
    <div class="login-card">
      <div style="margin-bottom:14px">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="52" height="52">
          <path d="M24 42S4 29.4 4 16.5C4 10.2 9.1 5 15.5 5c3.7 0 7 1.8 9.5 4.6C27.5 6.8 30.8 5 34.5 5 40.9 5 46 10.2 46 16.5 46 29.4 24 42 24 42z" fill="#93C5FD"/>
        </svg>
      </div>
      <div class="login-wordmark">Koko</div>
      <p class="login-tagline">Your personal life assistant</p>

      <!-- Login button (only when not yet logged in) -->
      <template x-if="view === 'login'">
        <div>
          <div id="telegram-login-wrap"></div>
          <p class="login-footer">
            Sign in with Telegram to continue.<br />
            Your data is stored privately on your server.
          </p>
        </div>
      </template>

      <!-- Pending approval -->
      <template x-if="view === 'pending'">
        <div>
          <div class="pending-box">
            <h3>⏳ Access Pending</h3>
            <p>Your request has been sent. You'll be notified on Telegram once the admin approves your account.</p>
          </div>
          <button class="btn-signout" @click="signOut()">Sign out</button>
        </div>
      </template>

      <!-- Rejected -->
      <template x-if="view === 'rejected'">
        <div>
          <div class="rejected-box">
            <h3>Access Declined</h3>
            <p>Your access request was not approved. You can request access again.</p>
            <button class="btn-reapply" :disabled="reapplying" @click="requestAccess()">
              <span x-text="reapplying ? 'Sending…' : 'Re-request Access'"></span>
            </button>
          </div>
          <button class="btn-signout" @click="signOut()">Sign out</button>
        </div>
      </template>

      <template x-if="error">
        <p class="login-error" x-text="error"></p>
      </template>
    </div>
  </div>

  <script>
    async function onTelegramAuth(user) {
      try {
        const resp = await fetch('/api/auth/telegram', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(user),
        });
        if (!resp.ok) throw new Error('Auth failed');
        const data = await resp.json();
        localStorage.setItem('koko_token', data.token);
        if (data.status === 'approved') {
          window.location.href = '/dashboard';
        } else {
          // reload to show pending/rejected view
          window.location.reload();
        }
      } catch (e) {
        const el = document.querySelector('[x-data]');
        if (el && el._x_dataStack) el._x_dataStack[0].error = 'Login failed. Please try again.';
      }
    }

    function loginPage() {
      return {
        view: 'login',   // login | pending | rejected
        error: null,
        reapplying: false,
        _pollTimer: null,

        async init() {
          const token = localStorage.getItem('koko_token');
          if (token) {
            // Check current status
            try {
              const resp = await fetch('/api/auth/status', {
                headers: { Authorization: `Bearer ${token}` },
              });
              if (resp.ok) {
                const data = await resp.json();
                if (data.status === 'approved') {
                  window.location.href = '/dashboard';
                  return;
                } else if (data.status === 'pending') {
                  this.view = 'pending';
                  this._startPolling();
                  return;
                } else {
                  this.view = 'rejected';
                  return;
                }
              }
            } catch (_) {}
            // Token invalid — clear and show login
            localStorage.removeItem('koko_token');
          }

          // Show login widget
          this.view = 'login';
          try {
            const cfg = await fetch('/api/config').then(r => r.json());
            if (!cfg.telegram_bot_username) {
              this.error = 'TELEGRAM_BOT_USERNAME not configured on server.';
              return;
            }
            const s = document.createElement('script');
            s.async = true;
            s.src = 'https://telegram.org/js/telegram-widget.js?22';
            s.setAttribute('data-telegram-login', cfg.telegram_bot_username);
            s.setAttribute('data-size', 'large');
            s.setAttribute('data-onauth', 'onTelegramAuth(user)');
            s.setAttribute('data-request-access', 'write');
            document.getElementById('telegram-login-wrap').appendChild(s);
          } catch (e) {
            this.error = 'Could not reach server.';
          }
        },

        _startPolling() {
          this._pollTimer = setInterval(async () => {
            const token = localStorage.getItem('koko_token');
            if (!token) return;
            try {
              const resp = await fetch('/api/auth/status', {
                headers: { Authorization: `Bearer ${token}` },
              });
              if (resp.ok) {
                const data = await resp.json();
                if (data.status === 'approved') {
                  clearInterval(this._pollTimer);
                  window.location.href = '/dashboard';
                } else if (data.status === 'rejected') {
                  clearInterval(this._pollTimer);
                  this.view = 'rejected';
                }
              }
            } catch (_) {}
          }, 5000);
        },

        async requestAccess() {
          this.reapplying = true;
          try {
            const token = localStorage.getItem('koko_token');
            await fetch('/api/auth/request-access', {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}` },
            });
            this.view = 'pending';
            this._startPolling();
          } catch (_) {
            this.error = 'Failed to send request. Try again.';
          } finally {
            this.reapplying = false;
          }
        },

        signOut() {
          localStorage.removeItem('koko_token');
          window.location.reload();
        },
      };
    }
  </script>
</body>
</html>
