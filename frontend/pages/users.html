<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koko — Users</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    .status-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 9px;
      border-radius: 999px;
    }
    .status-approved { background: #D1FAE5; color: #065F46; }
    .status-pending  { background: #FEF3C7; color: #92400E; }
    .status-rejected { background: #FEE2E2; color: #991B1B; }
    .user-row {
      display: grid;
      grid-template-columns: 48px 1fr 110px 140px 160px 130px;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid #F0EFEC;
      font-size: 13.5px;
    }
    .user-row:last-child { border-bottom: none; }
    .user-row-header {
      font-size: 11.5px;
      font-weight: 600;
      color: #ABAAA5;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #E8E7E3;
      object-fit: cover;
    }
    .avatar-placeholder {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #E8E7E3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #78776E;
    }
    .user-name { font-weight: 500; color: #1A1917; }
    .user-tid  { font-size: 12px; color: #ABAAA5; margin-top: 1px; }
    .action-btns { display: flex; gap: 6px; }
  </style>
</head>
<body x-data="usersApp()" x-init="init()">

<div class="page-shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span class="sidebar-logo-mark">✦</span>
      <span class="sidebar-logo-text" x-text="username ? 'Hi, ' + username + '!' : 'Hi there!'"></span>
    </div>
    <nav style="display:flex;flex-direction:column;gap:2px">
      <a href="/dashboard" class="nav-link"><span class="nav-icon">📅</span><span class="nav-label">Daily Tracker</span></a>
      <a href="/tasks"     class="nav-link"><span class="nav-icon">✅</span><span class="nav-label">Tasks</span></a>
      <a href="/workout"   class="nav-link"><span class="nav-icon">🏋️</span><span class="nav-label">Workout</span></a>
      <a href="/documents" class="nav-link"><span class="nav-icon">📄</span><span class="nav-label">Documents</span></a>
      <a href="/profile"   class="nav-link"><span class="nav-icon">👤</span><span class="nav-label">Profile</span></a>
      <a href="/users"     class="nav-link active"><span class="nav-icon">🛡️</span><span class="nav-label">Users</span></a>
    </nav>
    <div style="flex:1"></div>
    <button @click="logout()" class="nav-link danger"><span class="nav-icon">←</span><span class="nav-label">Sign out</span></button>
  </aside>

  <!-- Main -->
  <main class="page-main">

    <div class="page-header">
      <div>
        <h1 class="page-title">Users</h1>
        <p style="font-size:13px;color:#78776E;margin-top:2px">Manage access to Koko Fantasy</p>
      </div>
      <button @click="loadUsers()" class="btn btn-secondary">↻ Refresh</button>
    </div>

    <!-- Filter tabs -->
    <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap">
      <template x-for="f in ['all','pending','approved','rejected']" :key="f">
        <button
          @click="filter = f"
          :class="filter === f ? 'btn btn-primary btn-sm' : 'btn btn-secondary btn-sm'"
          x-text="f.charAt(0).toUpperCase() + f.slice(1) + (f === 'all' ? ' (' + users.length + ')' : ' (' + users.filter(u => u.status === f).length + ')')">
        </button>
      </template>
    </div>

    <!-- Users table -->
    <div class="card" style="padding:0;overflow:hidden">

      <!-- Header -->
      <div class="user-row user-row-header">
        <div></div>
        <div>User</div>
        <div>Status</div>
        <div>Joined</div>
        <div>Timezone</div>
        <div>Actions</div>
      </div>

      <!-- Loading -->
      <template x-if="loading">
        <div style="padding:32px;text-align:center;color:#ABAAA5;font-size:13.5px">Loading users…</div>
      </template>

      <!-- Empty -->
      <template x-if="!loading && filteredUsers.length === 0">
        <div style="padding:32px;text-align:center;color:#ABAAA5;font-size:13.5px">No users found.</div>
      </template>

      <!-- Rows -->
      <template x-for="u in filteredUsers" :key="u.id">
        <div class="user-row">
          <!-- Avatar -->
          <div>
            <template x-if="u.avatar_url">
              <img :src="u.avatar_url" class="user-avatar" :alt="u.username" />
            </template>
            <template x-if="!u.avatar_url">
              <div class="avatar-placeholder">👤</div>
            </template>
          </div>

          <!-- Name + TG ID -->
          <div>
            <div class="user-name" x-text="u.username ? '@' + u.username : 'Unknown'"></div>
            <div class="user-tid" x-text="'TG ' + u.telegram_id + (u.is_admin ? ' · Admin' : '')"></div>
          </div>

          <!-- Status badge -->
          <div>
            <span class="status-badge" :class="'status-' + u.status" x-text="u.status"></span>
          </div>

          <!-- Joined -->
          <div style="color:#78776E;font-size:13px" x-text="fmtDate(u.created_at)"></div>

          <!-- Timezone -->
          <div style="color:#78776E;font-size:12px;font-family:monospace" x-text="u.timezone || '—'"></div>

          <!-- Actions -->
          <div class="action-btns">
            <template x-if="u.status !== 'approved'">
              <button @click="setStatus(u, 'approved')" class="btn btn-primary btn-sm">Approve</button>
            </template>
            <template x-if="u.status !== 'rejected'">
              <button @click="setStatus(u, 'rejected')" class="btn btn-secondary btn-sm">Reject</button>
            </template>
          </div>
        </div>
      </template>
    </div>

  </main>
</div>

<script src="/static/js/app.js"></script>
<script>
  function usersApp() {
    return {
      username: null,
      users: [],
      filter: 'all',
      loading: true,

      get filteredUsers() {
        if (this.filter === 'all') return this.users;
        return this.users.filter(u => u.status === this.filter);
      },

      async init() {
        const token = localStorage.getItem('koko_token');
        if (!token) { window.location.href = '/'; return; }
        try {
          const me = await apiFetch('/api/users/me');
          if (!me.is_admin) { window.location.href = '/dashboard'; return; }
          this.username = me.username;
        } catch (e) {
          window.location.href = '/';
          return;
        }
        await this.loadUsers();
      },

      async loadUsers() {
        this.loading = true;
        try {
          this.users = await apiFetch('/api/users/');
        } catch (e) {
          console.error('Failed to load users', e);
        } finally {
          this.loading = false;
        }
      },

      async setStatus(user, status) {
        const prev = user.status;
        user.status = status; // optimistic
        try {
          await apiFetch(`/api/users/${user.id}/status`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status }),
          });
        } catch (e) {
          user.status = prev;
          alert('Failed to update status. Please try again.');
        }
      },

      fmtDate(iso) {
        if (!iso) return '—';
        return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      },

      logout() {
        localStorage.removeItem('koko_token');
        window.location.href = '/';
      },
    };
  }
</script>
</body>
</html>
