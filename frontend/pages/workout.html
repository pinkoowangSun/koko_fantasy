<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koko — Workout</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    .tab-bar { display:flex; gap:4px; background:#F0EFE9; border-radius:10px; padding:3px; margin-bottom:24px; width:fit-content; }
    .tab-btn { padding:6px 18px; border-radius:8px; font-size:13px; font-weight:500; cursor:pointer; border:none; background:transparent; color:#78776E; transition:all .12s; font-family:inherit; }
    .tab-btn.active { background:#fff; color:#1A1917; box-shadow:0 1px 3px rgba(0,0,0,.08); }

    .week-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:10px; margin-bottom:24px; }
    @media(max-width:900px) { .week-grid { grid-template-columns:repeat(4,1fr); } }
    @media(max-width:600px) { .week-grid { grid-template-columns:repeat(2,1fr); } }

    .day-card { background:#fff; border:1px solid #E8E7E3; border-radius:12px; padding:14px; min-height:160px; position:relative; cursor:default; transition:box-shadow .12s; }
    .day-card.today { border-color:#1A1917; box-shadow:0 0 0 2px rgba(26,25,23,.08); }
    .day-card.rest-day { background:#FAFAF8; }
    .day-name { font-size:11px; font-weight:600; color:#78776E; text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
    .day-focus { font-size:13px; font-weight:600; color:#1A1917; margin-bottom:8px; line-height:1.3; }
    .day-duration { font-size:11.5px; color:#ABAAA5; margin-top:6px; }
    .exercise-pill { display:inline-block; font-size:11px; background:#F0EFE9; color:#4A4940; border-radius:5px; padding:2px 7px; margin:2px 2px 2px 0; line-height:1.6; }
    .rest-badge { font-size:11px; color:#ABAAA5; font-style:italic; margin-top:4px; }

    .log-area { resize:vertical; min-height:100px; }

    .history-item { background:#fff; border:1px solid #E8E7E3; border-radius:12px; padding:16px 18px; }
    .cat-badge { display:inline-block; font-size:11.5px; font-weight:500; border-radius:20px; padding:2px 10px; }
    .cat-cardio      { background:#DBEAFE; color:#1D4ED8; }
    .cat-upper_body  { background:#FCE7F3; color:#9D174D; }
    .cat-lower_body  { background:#D1FAE5; color:#065F46; }
    .cat-core        { background:#FEF3C7; color:#92400E; }
    .cat-flexibility { background:#EDE9FE; color:#4C1D95; }
    .cat-mixed       { background:#E0F2FE; color:#075985; }
    .cat-rest        { background:#F3F4F6; color:#6B7280; }

    .no-plan-cta { text-align:center; padding:60px 24px; }
    .no-plan-cta h2 { font-size:18px; font-weight:600; margin-bottom:8px; }
    .no-plan-cta p  { font-size:13.5px; color:#78776E; margin-bottom:24px; max-width:380px; margin-inline:auto; }

    .ai-notes-box { background:#F6F5F2; border-radius:10px; padding:14px 16px; font-size:13px; color:#4A4940; line-height:1.6; margin-bottom:20px; }
    .ai-notes-label { font-size:11px; font-weight:600; color:#ABAAA5; text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }

    .spinner { display:inline-block; width:16px; height:16px; border:2px solid #E8E7E3; border-top-color:#1A1917; border-radius:50%; animation:spin .6s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body x-data="workoutApp()" x-init="init()">

<div class="page-shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo" x-text="username ? 'Hi, ' + username + '!' : 'Hi there!'"></div>
    <nav style="display:flex;flex-direction:column;gap:2px">
      <a href="/dashboard" class="nav-link">📅 Daily Tracker</a>
      <a href="/tasks"     class="nav-link">✅ Tasks</a>
      <a href="/workout"   class="nav-link active">🏋️ Workout</a>
      <a href="/documents" class="nav-link">📄 Documents</a>
      <a href="/profile"   class="nav-link">👤 Profile</a>
    </nav>
    <div style="flex:1"></div>
    <button @click="logout()" class="nav-link danger" style="color:#9CA3AF">← Sign out</button>
  </aside>

  <!-- Main -->
  <main class="page-main">

    <div class="page-header">
      <div>
        <h1 class="page-title">Workout</h1>
        <p style="font-size:13px;color:#78776E;margin-top:2px" x-text="weekLabel"></p>
      </div>
      <div style="display:flex;gap:8px">
        <button @click="openLogModal()" class="btn btn-secondary">+ Log Workout</button>
        <button @click="generatePlan()" class="btn btn-primary" :disabled="generating">
          <span x-show="generating" class="spinner"></span>
          <span x-show="!generating">✨ AI Plan</span>
          <span x-show="generating">Generating…</span>
        </button>
      </div>
    </div>

    <!-- Toast -->
    <div x-show="toast" x-transition style="background:#1A1917;color:#fff;border-radius:10px;padding:10px 16px;font-size:13px;margin-bottom:16px;display:flex;align-items:center;gap:8px" x-cloak>
      <span x-text="toast"></span>
    </div>

    <!-- Preference hint -->
    <div style="font-size:12.5px;color:#78776E;background:#F6F5F2;border-radius:9px;padding:9px 14px;margin-bottom:20px;display:flex;align-items:center;gap:8px">
      <span>💡</span>
      <span>Your plan is personalised using your workout history. To guide the AI further — e.g. <em>"weight loss, 4 days/week, no equipment"</em> — go to <a href="/profile" style="color:#1A1917;font-weight:500;text-decoration:underline">Profile</a> and add a memory item with key <strong>workout</strong>.</span>
    </div>

    <!-- Tab bar -->
    <div class="tab-bar">
      <button class="tab-btn" :class="{active:tab==='plan'}"    @click="tab='plan'">Weekly Plan</button>
      <button class="tab-btn" :class="{active:tab==='history'}" @click="tab='history';loadLogs()">History</button>
    </div>

    <!-- ── PLAN TAB ── -->
    <div x-show="tab==='plan'">

      <!-- Loading -->
      <template x-if="loadingPlan">
        <div class="card" style="text-align:center;padding:48px;color:#ABAAA5">
          <div class="spinner" style="width:24px;height:24px;margin:0 auto 12px"></div>
          <p style="font-size:13.5px">Loading plan…</p>
        </div>
      </template>

      <!-- No plan -->
      <template x-if="!loadingPlan && !plan">
        <div class="card no-plan-cta">
          <div style="font-size:40px;margin-bottom:16px">🏋️</div>
          <h2>No plan for this week yet</h2>
          <p>Let the AI analyse your workout history and create a personalised weekly plan with detailed exercises, sets, reps, and guidance.</p>
          <button @click="generatePlan()" class="btn btn-primary" :disabled="generating" style="font-size:14px;padding:10px 24px">
            <span x-show="generating" class="spinner"></span>
            <span x-show="!generating">✨ Generate AI Plan</span>
            <span x-show="generating">Generating…</span>
          </button>
        </div>
      </template>

      <!-- Plan grid -->
      <template x-if="!loadingPlan && plan">
        <div>
          <!-- AI notes -->
          <template x-if="plan.ai_notes">
            <div class="ai-notes-box">
              <div class="ai-notes-label">🤖 AI Trainer Notes</div>
              <span x-text="plan.ai_notes"></span>
            </div>
          </template>

          <div class="week-grid">
            <template x-for="day in days" :key="day.key">
              <div class="day-card" :class="{today: day.isToday, 'rest-day': isRestDay(day.key)}">
                <div class="day-name" x-text="day.label"></div>
                <template x-if="dayPlan(day.key)">
                  <div>
                    <div class="day-focus" x-text="dayPlan(day.key).focus"></div>
                    <template x-if="!isRestDay(day.key) && dayPlan(day.key).warmup">
                      <div style="font-size:11px;color:#ABAAA5;margin-bottom:6px">🔥 <span x-text="dayPlan(day.key).warmup"></span></div>
                    </template>
                    <template x-if="isRestDay(day.key)">
                      <div class="rest-badge" x-text="dayPlan(day.key).notes || 'Rest & recover'"></div>
                    </template>
                    <template x-if="!isRestDay(day.key)">
                      <div>
                        <template x-for="ex in (dayPlan(day.key).exercises || []).slice(0,4)" :key="ex.name">
                          <span class="exercise-pill" x-text="ex.name"></span>
                        </template>
                        <template x-if="(dayPlan(day.key).exercises || []).length > 4">
                          <span class="exercise-pill" style="background:#E8E7E3;color:#78776E" x-text="'+' + ((dayPlan(day.key).exercises || []).length - 4) + ' more'"></span>
                        </template>
                        <template x-if="dayPlan(day.key).duration_min">
                          <div class="day-duration">⏱ <span x-text="dayPlan(day.key).duration_min"></span> min</div>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>
                <template x-if="!dayPlan(day.key)">
                  <div class="rest-badge">No plan</div>
                </template>
                <!-- "Today" pill -->
                <template x-if="day.isToday">
                  <div style="position:absolute;top:10px;right:10px;background:#1A1917;color:#fff;font-size:10px;font-weight:600;border-radius:4px;padding:2px 7px;letter-spacing:.3px">TODAY</div>
                </template>
              </div>
            </template>
          </div>

          <!-- Day detail expand -->
          <div style="margin-top:4px">
            <template x-for="day in days" :key="'detail-' + day.key">
              <template x-if="dayPlan(day.key) && !isRestDay(day.key) && (dayPlan(day.key).exercises || []).length > 0">
                <div class="card" style="margin-bottom:10px">
                  <div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer" @click="toggleDay(day.key)">
                    <div>
                      <span style="font-size:13px;font-weight:600;color:#1A1917" x-text="day.label + ' — ' + dayPlan(day.key).focus"></span>
                      <template x-if="day.isToday">
                        <span style="margin-left:8px;background:#1A1917;color:#fff;font-size:10px;font-weight:600;border-radius:4px;padding:2px 7px">TODAY</span>
                      </template>
                    </div>
                    <span style="color:#ABAAA5;font-size:13px" x-text="expandedDay===day.key ? '▲' : '▼'"></span>
                  </div>

                  <template x-if="expandedDay===day.key">
                    <div style="margin-top:14px">
                      <template x-if="dayPlan(day.key).warmup">
                        <div style="font-size:12.5px;color:#78776E;margin-bottom:10px">🔥 <strong>Warm-up:</strong> <span x-text="dayPlan(day.key).warmup"></span></div>
                      </template>
                      <table style="width:100%;border-collapse:collapse;font-size:13px">
                        <thead>
                          <tr style="border-bottom:1px solid #E8E7E3">
                            <th style="text-align:left;padding:6px 0;color:#78776E;font-weight:500;font-size:12px">Exercise</th>
                            <th style="text-align:center;padding:6px 8px;color:#78776E;font-weight:500;font-size:12px">Sets</th>
                            <th style="text-align:center;padding:6px 8px;color:#78776E;font-weight:500;font-size:12px">Reps</th>
                            <th style="text-align:center;padding:6px 8px;color:#78776E;font-weight:500;font-size:12px">Weight</th>
                            <th style="text-align:left;padding:6px 8px;color:#78776E;font-weight:500;font-size:12px">Notes</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="ex in (dayPlan(day.key).exercises || [])" :key="ex.name">
                            <tr style="border-bottom:1px solid #F0EFE9">
                              <td style="padding:8px 0;font-weight:500" x-text="ex.name"></td>
                              <td style="text-align:center;padding:8px" x-text="ex.sets || '—'"></td>
                              <td style="text-align:center;padding:8px;color:#4A4940" x-text="ex.reps || '—'"></td>
                              <td style="text-align:center;padding:8px;color:#4A4940" x-text="ex.weight || '—'"></td>
                              <td style="padding:8px;color:#78776E;font-size:12px" x-text="ex.notes || ''"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                      <template x-if="dayPlan(day.key).cooldown">
                        <div style="font-size:12.5px;color:#78776E;margin-top:10px">🧊 <strong>Cool-down:</strong> <span x-text="dayPlan(day.key).cooldown"></span></div>
                      </template>
                      <template x-if="dayPlan(day.key).notes">
                        <div style="font-size:12.5px;color:#78776E;margin-top:8px;background:#F6F5F2;border-radius:8px;padding:10px">📝 <span x-text="dayPlan(day.key).notes"></span></div>
                      </template>
                    </div>
                  </template>
                </div>
              </template>
            </template>
          </div>

        </div>
      </template>
    </div>

    <!-- ── HISTORY TAB ── -->
    <div x-show="tab==='history'">
      <template x-if="loadingLogs">
        <div class="card" style="text-align:center;padding:48px;color:#ABAAA5">
          <div class="spinner" style="width:24px;height:24px;margin:0 auto 12px"></div>
          <p style="font-size:13.5px">Loading history…</p>
        </div>
      </template>

      <template x-if="!loadingLogs && logs.length === 0">
        <div class="card" style="text-align:center;padding:48px;color:#ABAAA5">
          <p style="font-size:14px">No workouts logged yet.</p>
          <p style="font-size:13px;margin-top:6px">Click "Log Workout" or tell the Telegram bot what you did.</p>
        </div>
      </template>

      <div style="display:flex;flex-direction:column;gap:8px">
        <template x-for="log in logs" :key="log.id">
          <div class="history-item">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
              <div style="flex:1;min-width:0">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">
                  <span style="font-size:12.5px;font-weight:600;color:#1A1917" x-text="fmtLogDate(log.log_date)"></span>
                  <span class="cat-badge" :class="'cat-' + (log.category || 'mixed')" x-text="(log.category || 'mixed').replace('_',' ')"></span>
                  <span style="font-size:11.5px;color:#ABAAA5" x-text="log.source === 'telegram' ? '📱 via Telegram' : '💻 via Web'"></span>
                </div>
                <div style="font-size:13px;color:#4A4940;line-height:1.5" x-text="log.raw_text"></div>
                <template x-if="log.summary && log.summary !== log.raw_text">
                  <div style="font-size:12px;color:#78776E;margin-top:6px;font-style:italic" x-text="log.summary"></div>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>

  </main>
</div>

<!-- Log Workout Modal -->
<div x-show="showLogModal" x-cloak
  style="position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px"
  @click.self="showLogModal=false">
  <div class="card" style="width:100%;max-width:480px;padding:24px" @keydown.escape.window="showLogModal=false">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
      <h2 style="font-size:16px;font-weight:600">Log Workout</h2>
      <button @click="showLogModal=false" style="background:none;border:none;cursor:pointer;color:#ABAAA5;font-size:18px">✕</button>
    </div>

    <div style="margin-bottom:14px">
      <label style="font-size:12.5px;font-weight:500;color:#4A4940;display:block;margin-bottom:6px">What did you do? <span style="color:#ABAAA5">(free text — AI will classify it)</span></label>
      <textarea
        x-model="logText"
        class="input log-area"
        placeholder="e.g. ran 5km in 28 min, then 3 sets of push-ups and pull-ups"
        @keydown.meta.enter="submitLog()"
        @keydown.ctrl.enter="submitLog()"
      ></textarea>
      <div style="font-size:11.5px;color:#ABAAA5;margin-top:4px">⌘↵ or Ctrl↵ to submit</div>
    </div>

    <div style="margin-bottom:18px">
      <label style="font-size:12.5px;font-weight:500;color:#4A4940;display:block;margin-bottom:6px">Date</label>
      <input type="date" x-model="logDate" class="input" style="width:auto" />
    </div>

    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button @click="showLogModal=false" class="btn btn-secondary">Cancel</button>
      <button @click="submitLog()" class="btn btn-primary" :disabled="!logText.trim() || submitting">
        <span x-show="submitting" class="spinner"></span>
        <span x-show="!submitting">Save</span>
      </button>
    </div>
  </div>
</div>

<script src="/static/js/app.js"></script>
<script>
function workoutApp() {
  return {
    username: '',
    tab: 'plan',
    plan: null,
    logs: [],
    loadingPlan: true,
    loadingLogs: false,
    generating: false,
    submitting: false,
    showLogModal: false,
    logText: '',
    logDate: new Date().toISOString().slice(0, 10),
    expandedDay: null,
    toast: '',
    _toastTimer: null,

    days: (() => {
      const names = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
      const labels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
      const todayIdx = (new Date().getDay() + 6) % 7; // 0=Mon
      return names.map((k, i) => ({ key: k, label: labels[i], isToday: i === todayIdx }));
    })(),

    get weekLabel() {
      const today = new Date();
      const mon = new Date(today);
      mon.setDate(today.getDate() - (today.getDay() + 6) % 7);
      const sun = new Date(mon);
      sun.setDate(mon.getDate() + 6);
      const fmt = d => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      return `Week of ${fmt(mon)} – ${fmt(sun)}`;
    },

    async init() {
      requireAuth();
      const token = API.token();
      try {
        const me = await API.get('/users/me');
        this.username = me.username || '';
      } catch {}
      await this.loadPlan();
    },

    async loadPlan() {
      this.loadingPlan = true;
      try {
        this.plan = await API.get('/workout/plan');
      } catch {
        this.plan = null;
      } finally {
        this.loadingPlan = false;
      }
    },

    async loadLogs() {
      if (this.loadingLogs) return;
      this.loadingLogs = true;
      try {
        this.logs = await API.get('/workout/logs?limit=50');
      } catch {
        this.logs = [];
      } finally {
        this.loadingLogs = false;
      }
    },

    dayPlan(key) {
      return this.plan?.plan?.[key] || null;
    },

    isRestDay(key) {
      const dp = this.dayPlan(key);
      if (!dp) return false;
      const focus = (dp.focus || '').toLowerCase();
      return focus.includes('rest') || (dp.exercises || []).length === 0;
    },

    toggleDay(key) {
      this.expandedDay = this.expandedDay === key ? null : key;
    },

    async generatePlan() {
      if (this.generating) return;
      this.generating = true;
      try {
        this.plan = await API.post('/workout/plan/generate', {});
        this.showToast('✨ AI workout plan generated for this week!');
        this.tab = 'plan';
      } catch (e) {
        this.showToast('Failed to generate plan: ' + e.message);
      } finally {
        this.generating = false;
      }
    },

    openLogModal() {
      this.logText = '';
      this.logDate = new Date().toISOString().slice(0, 10);
      this.showLogModal = true;
    },

    async submitLog() {
      if (!this.logText.trim() || this.submitting) return;
      this.submitting = true;
      try {
        await API.post('/workout/logs', {
          raw_text: this.logText.trim(),
          log_date: this.logDate || null,
          source: 'web',
        });
        this.showLogModal = false;
        this.showToast('💪 Workout logged!');
        if (this.tab === 'history') await this.loadLogs();
      } catch (e) {
        this.showToast('Error: ' + e.message);
      } finally {
        this.submitting = false;
      }
    },

    fmtLogDate(iso) {
      if (!iso) return '';
      const d = new Date(iso + 'T00:00:00');
      const today = new Date();
      const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
      if (iso === today.toISOString().slice(0,10)) return 'Today';
      if (iso === yesterday.toISOString().slice(0,10)) return 'Yesterday';
      return d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
    },

    showToast(msg) {
      this.toast = msg;
      clearTimeout(this._toastTimer);
      this._toastTimer = setTimeout(() => { this.toast = ''; }, 3500);
    },

    logout() { logout(); },
  };
}
</script>
</body>
</html>
