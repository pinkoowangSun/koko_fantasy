<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koko — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="bg-gray-50 min-h-screen" x-data="dashboardApp()" x-init="init()">

  <!-- Layout -->
  <div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-56 bg-white border-r border-gray-100 flex flex-col p-4 gap-1 shrink-0">
      <div class="text-xl font-bold text-indigo-600 mb-6 px-2">🪄 Koko</div>
      <a href="/dashboard" class="nav-link active">📅 Daily Tracker</a>
      <a href="/tasks"     class="nav-link">✅ Tasks</a>
      <a href="/documents" class="nav-link">📄 Documents</a>
      <a href="/profile"   class="nav-link">👤 Profile</a>
      <div class="flex-1"></div>
      <button @click="logout()" class="nav-link text-red-500 hover:bg-red-50 hover:text-red-600">🚪 Logout</button>
    </aside>

    <!-- Main -->
    <main class="flex-1 overflow-y-auto p-6">

      <!-- Header + briefing button -->
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Daily Tracker</h1>
        <button @click="loadBriefing()"
          class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition-colors">
          ✨ Today's Briefing
        </button>
      </div>

      <!-- Briefing panel -->
      <template x-if="briefing">
        <div class="card mb-6 bg-indigo-50 border-indigo-200">
          <div class="flex justify-between items-start mb-2">
            <h2 class="font-semibold text-indigo-700">✨ Daily Briefing</h2>
            <button @click="briefing = null" class="text-gray-400 hover:text-gray-600 text-lg leading-none">×</button>
          </div>
          <p class="text-gray-700 text-sm whitespace-pre-wrap" x-text="briefing"></p>
        </div>
      </template>

      <!-- Calendar -->
      <div class="card mb-6">
        <div id="calendar"></div>
      </div>

      <!-- Legend -->
      <div class="flex gap-4 text-xs text-gray-500 mb-6">
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span> Tasks</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span> Journal</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-amber-400 inline-block"></span> Documents</span>
      </div>
    </main>
  </div>

  <!-- Day Detail Modal -->
  <div x-show="modal" x-cloak class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4"
       @click.self="modal = null">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[80vh] overflow-y-auto p-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-gray-900" x-text="modal?.date"></h2>
        <button @click="modal = null" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">×</button>
      </div>

      <!-- Journal entries -->
      <template x-if="modal?.journal?.length">
        <div class="mb-4">
          <h3 class="text-sm font-semibold text-emerald-600 mb-2">📓 Journal</h3>
          <template x-for="j in modal.journal" :key="j.id">
            <div class="bg-emerald-50 rounded-lg p-3 mb-2">
              <p class="text-sm font-medium text-gray-800" x-text="j.title || '(no title)'"></p>
              <template x-if="j.content_html">
                <div class="text-sm text-gray-600 mt-1 prose prose-sm" x-html="j.content_html"></div>
              </template>
              <template x-if="!j.content_html && j.content">
                <p class="text-sm text-gray-600 mt-1" x-text="j.content"></p>
              </template>
              <p class="text-xs text-gray-400 mt-1" x-text="j.mood ? '😊 ' + j.mood : ''"></p>
            </div>
          </template>
        </div>
      </template>

      <!-- Tasks -->
      <template x-if="modal?.tasks?.length">
        <div class="mb-4">
          <h3 class="text-sm font-semibold text-blue-600 mb-2">✅ Tasks due</h3>
          <template x-for="t in modal.tasks" :key="t.id">
            <div class="flex items-center gap-2 text-sm py-1 border-b border-gray-50 last:border-0">
              <span x-text="statusIcon(t.status)"></span>
              <span class="flex-1 text-gray-800" x-text="t.title"></span>
              <a :href="`/tasks`" class="text-xs text-indigo-500 hover:underline">View →</a>
            </div>
          </template>
        </div>
      </template>

      <!-- Documents -->
      <template x-if="modal?.documents?.length">
        <div>
          <h3 class="text-sm font-semibold text-amber-600 mb-2">📄 Documents</h3>
          <template x-for="d in modal.documents" :key="d.id">
            <div class="flex items-center justify-between text-sm py-1 border-b border-gray-50 last:border-0">
              <span class="text-gray-800" x-text="d.original_name"></span>
              <a :href="`/documents`" class="text-xs text-indigo-500 hover:underline">View →</a>
            </div>
          </template>
        </div>
      </template>

      <template x-if="!modal?.journal?.length && !modal?.tasks?.length && !modal?.documents?.length">
        <p class="text-gray-400 text-sm text-center py-4">Nothing recorded on this day.</p>
      </template>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  <script>
    function dashboardApp() {
      return {
        briefing: null,
        modal: null,
        calendar: null,

        init() {
          requireAuth();
          this.initCalendar();
        },

        initCalendar() {
          const self = this;
          const el = document.getElementById('calendar');
          this.calendar = new FullCalendar.Calendar(el, {
            initialView: 'dayGridMonth',
            height: 'auto',
            headerToolbar: {
              left: 'prev,next today',
              center: 'title',
              right: 'dayGridMonth,dayGridWeek',
            },
            eventSources: [{
              events: async (info, success, failure) => {
                try {
                  const start = info.startStr.slice(0, 10);
                  const end   = info.endStr.slice(0, 10);
                  const events = await API.get(`/calendar/events?start=${start}&end=${end}`);
                  success(events);
                } catch (e) {
                  failure(e);
                }
              },
            }],
            dateClick: (info) => self.openDayModal(info.dateStr),
            eventClick: (info) => self.openDayModal(info.event.startStr),
          });
          this.calendar.render();
        },

        async openDayModal(dateStr) {
          try {
            const detail = await API.get(`/calendar/day-detail?day=${dateStr}`);
            this.modal = detail;
          } catch (e) {
            console.error(e);
          }
        },

        async loadBriefing() {
          try {
            const result = await API.get('/briefing/');
            this.briefing = result.briefing;
          } catch (e) {
            alert('Failed to load briefing: ' + e.message);
          }
        },

        statusIcon(status) {
          return { todo: '⏳', in_progress: '🔄', done: '✅', cancelled: '❌' }[status] || '⏳';
        },

        logout,
      };
    }
  </script>
</body>
</html>
