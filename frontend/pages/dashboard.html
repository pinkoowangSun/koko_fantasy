<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koko — Daily Tracker</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    /* Calendar overrides */
    .fc { font-family: 'Inter', sans-serif; font-size: 13px; }
    .fc-toolbar-title { font-size: 15px !important; font-weight: 600 !important; }
    .fc-button { font-size: 12.5px !important; font-family: 'Inter', sans-serif !important; }
    .fc-daygrid-day:hover { background: #F6F5F2 !important; cursor: pointer; }
    .fc-col-header-cell { font-weight: 500; color: #78776E; font-size: 12px; }
    .fc-daygrid-day-number { font-size: 12.5px; color: #1A1917; }
    .fc-event { border-radius: 4px !important; border: none !important; font-size: 11px !important; }
    .fc-toolbar.fc-header-toolbar { margin-bottom: 16px !important; }
  </style>
</head>
<body x-data="dashboardApp()" x-init="init()">

<div class="page-shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
  <span class="sidebar-logo-mark">✦</span>
  <span class="sidebar-logo-text" x-text="username ? 'Hi, ' + username + '!' : 'Hi there!'"></span>
</div>
    <nav style="display:flex;flex-direction:column;gap:2px"></nav>
    <div style="flex:1"></div>
    <button @click="logout()" class="nav-link danger"><span class="nav-icon">←</span><span class="nav-label">Sign out</span></button>
  </aside>

  <!-- Main -->
  <main class="page-main">

    <div class="page-header">
      <div>
        <h1 class="page-title">Daily Tracker</h1>
        <p style="font-size:13px;color:#78776E;margin-top:2px" x-text="todayLabel"></p>
      </div>
      <button @click="openAddEntry()" class="btn btn-primary">+ Add Entry</button>
    </div>

    <!-- Calendar -->
    <div class="card" style="margin-bottom:20px">
      <div id="calendar"></div>
    </div>

    <!-- Legend -->
    <div style="display:flex;gap:16px;font-size:12px;color:#78776E">
      <span style="display:flex;align-items:center;gap:5px">
        <span style="width:8px;height:8px;border-radius:50%;background:#3B82F6;display:inline-block"></span> Tasks
      </span>
      <span style="display:flex;align-items:center;gap:5px">
        <span style="width:8px;height:8px;border-radius:50%;background:#10B981;display:inline-block"></span> Journal
      </span>
      <span style="display:flex;align-items:center;gap:5px">
        <span style="width:8px;height:8px;border-radius:50%;background:#F59E0B;display:inline-block"></span> Documents
      </span>
    </div>

  </main>
</div>

<!-- ── Day Detail Modal ───────────────────────────────────────── -->
<div x-show="dayModal" x-cloak
     style="position:fixed;inset:0;background:rgba(0,0,0,0.30);backdrop-filter:blur(6px);z-index:50;overflow-y:auto;padding:24px"
     @click.self="dayModal=null; journalDetail=null">
  <div style="min-height:100%;display:flex;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,0.12);width:100%;max-width:400px"
       @click.stop>

    <!-- Header -->
    <div style="padding:20px 20px 0;display:flex;justify-content:space-between;align-items:flex-start">
      <div style="display:flex;align-items:center;gap:8px">
        <template x-if="journalDetail">
          <button @click="journalDetail=null"
            style="background:none;border:none;cursor:pointer;font-size:13.5px;color:#ABAAA5;padding:0;font-family:inherit;line-height:1">← Back</button>
        </template>
        <div>
          <p style="font-size:11.5px;color:#ABAAA5;margin:0 0 2px"
             x-text="journalDetail ? (journalDetail.mood || 'Journal') : (dayModal ? new Date(dayModal.date+'T00:00:00').toLocaleDateString(undefined,{weekday:'long'}) : '')"></p>
          <p style="font-size:17px;font-weight:600;color:#1A1917;margin:0;letter-spacing:-0.3px"
             x-text="journalDetail ? (journalDetail.title || 'Journal entry') : (dayModal ? new Date(dayModal.date+'T00:00:00').toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'}) : '')"></p>
        </div>
      </div>
      <button @click="dayModal=null; journalDetail=null"
        style="width:26px;height:26px;border-radius:50%;background:#F0EFEC;border:none;cursor:pointer;font-size:12px;color:#78776E;display:flex;align-items:center;justify-content:center;flex-shrink:0">✕</button>
    </div>

    <!-- Journal detail view -->
    <template x-if="journalDetail">
      <div style="padding:16px 20px 24px">
        <template x-if="journalDetail.content_html">
          <div style="font-size:14px;color:#4B4B47;line-height:1.7" x-html="journalDetail.content_html"></div>
        </template>
        <template x-if="!journalDetail.content_html && journalDetail.content">
          <p style="font-size:14px;color:#4B4B47;line-height:1.7;margin:0" x-text="journalDetail.content"></p>
        </template>
        <template x-if="!journalDetail.content_html && !journalDetail.content">
          <p style="font-size:13.5px;color:#ABAAA5;font-style:italic;margin:0">No content recorded.</p>
        </template>
      </div>
    </template>

    <!-- Summary list (hidden while viewing journal detail) -->
    <div x-show="!journalDetail" style="padding:16px 20px 20px">

      <!-- Journal -->
      <template x-if="dayModal?.journal?.filter(j => j.title || j.content || j.content_html).length">
        <div style="margin-bottom:18px">
          <p style="font-size:11px;color:#ABAAA5;font-weight:500;margin:0 0 4px">Journal</p>
          <template x-for="j in dayModal.journal.filter(j => j.title || j.content || j.content_html)" :key="j.id">
            <div @click="openJournalDetail(j)"
                 style="display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #F3F4F6;cursor:pointer">
              <span style="font-size:15px;flex-shrink:0" x-text="j.mood_icon || '📓'"></span>
              <span style="flex:1;font-size:13.5px;color:#1A1917;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
                    x-text="j.title || 'Journal entry'"></span>
              <span style="font-size:12px;color:#ABAAA5">›</span>
            </div>
          </template>
        </div>
      </template>

      <!-- Tasks -->
      <template x-if="dayModal?.tasks?.length">
        <div style="margin-bottom:18px">
          <p style="font-size:11px;color:#ABAAA5;font-weight:500;margin:0 0 4px">Tasks</p>
          <template x-for="t in dayModal.tasks" :key="t.id">
            <div @click="dayModal=null; window.location.href='/tasks'"
                 style="display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #F3F4F6;cursor:pointer">
              <span x-text="statusIcon(t.status)" style="font-size:14px;flex-shrink:0"></span>
              <span style="flex:1;font-size:13.5px;color:#1A1917;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
                    x-text="t.title"></span>
              <span style="font-size:12px;color:#ABAAA5">›</span>
            </div>
          </template>
        </div>
      </template>

      <!-- Documents -->
      <template x-if="dayModal?.documents?.length">
        <div style="margin-bottom:18px">
          <p style="font-size:11px;color:#ABAAA5;font-weight:500;margin:0 0 4px">Documents</p>
          <template x-for="d in dayModal.documents" :key="d.id">
            <div @click="dayModal=null; window.location.href='/documents'"
                 style="display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #F3F4F6;cursor:pointer">
              <span style="font-size:14px;flex-shrink:0">📄</span>
              <span style="flex:1;font-size:13.5px;color:#1A1917;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
                    x-text="d.original_name"></span>
              <span style="font-size:12px;color:#ABAAA5">›</span>
            </div>
          </template>
        </div>
      </template>

      <!-- Finance -->
      <template x-if="dayModal?.finance?.transactions?.length">
        <div style="margin-bottom:18px">
          <p style="font-size:11px;color:#ABAAA5;font-weight:500;margin:0 0 4px">Money</p>
          <!-- Net per currency -->
          <template x-for="row in dayModalFinanceNet" :key="row.cur">
            <div @click="dayModal=null; window.location.href='/finance'"
                 style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F3F4F6;cursor:pointer">
              <span style="font-size:13px;color:#78776E">Net today</span>
              <span style="font-size:13.5px;font-weight:600"
                    :style="'color:'+(row.net>=0?'#16A34A':'#DC2626')"
                    x-text="(row.net>=0?'+':'−')+Math.abs(row.net).toLocaleString()+' '+row.cur"></span>
            </div>
          </template>
          <!-- Transactions -->
          <template x-for="t in dayModal.finance.transactions" :key="t.id">
            <div @click="dayModal=null; window.location.href='/finance'"
                 style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F3F4F6;cursor:pointer">
              <span style="font-size:13.5px;color:#1A1917;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
                    x-text="t.description||t.category"></span>
              <span style="font-size:13px;flex-shrink:0;margin-left:12px"
                    :style="'color:'+(t.transaction_type==='income'?'#16A34A':'#DC2626')"
                    x-text="(t.transaction_type==='income'?'+':'−')+Number(t.amount).toLocaleString()+' '+t.currency"></span>
            </div>
          </template>
          <!-- Goal gaps -->
          <template x-if="activeGoalsWithGap.length > 0">
            <template x-for="g in activeGoalsWithGap" :key="g.title">
              <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0">
                <span style="font-size:13px;color:#78776E;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
                      x-text="g.title"></span>
                <span style="font-size:12px;font-weight:500;flex-shrink:0;margin-left:12px"
                      :style="'color:'+(g.gap<=0?'#16A34A':'#ABAAA5')"
                      x-text="g.gap<=0?'Achieved':Math.abs(g.gap).toLocaleString()+' '+g.currency+' to go'"></span>
              </div>
            </template>
          </template>
        </div>
      </template>

      <!-- Empty state -->
      <template x-if="!dayModal?.journal?.filter(j => j.title || j.content || j.content_html).length && !dayModal?.tasks?.length && !dayModal?.documents?.length && !dayModal?.finance?.transactions?.length">
        <div style="text-align:center;padding:28px 0 8px">
          <p style="font-size:14px;font-weight:500;color:#1A1917;margin:0 0 4px">Nothing here yet</p>
          <p style="font-size:13px;color:#ABAAA5;margin:0 0 18px">No entries on this day.</p>
          <button @click="dayModal=null;openAddEntry()"
            style="background:#1A1917;color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:13.5px;font-weight:500;cursor:pointer;font-family:inherit">
            + Add Entry
          </button>
        </div>
      </template>

      <!-- Add button -->
      <template x-if="dayModal?.journal?.filter(j => j.title || j.content || j.content_html).length || dayModal?.tasks?.length || dayModal?.documents?.length || dayModal?.finance?.transactions?.length">
        <button @click="dayModal=null;openAddEntry()"
          style="width:100%;height:40px;background:#F6F5F2;color:#1A1917;border:none;border-radius:10px;font-size:13.5px;font-weight:500;cursor:pointer;font-family:inherit;margin-top:6px">
          + Add Entry
        </button>
      </template>

    </div>
  </div>
  </div>
</div>

<!-- ── Add Entry Modal ────────────────────────────────────────── -->
<div x-show="addEntry.open" x-cloak
     style="position:fixed;inset:0;background:rgba(0,0,0,0.40);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px"
     @click.self="addEntry.open=false">
  <div style="background:#fff;border-radius:22px;box-shadow:0 32px 80px rgba(0,0,0,0.20);width:100%;max-width:520px;min-width:320px;max-height:90vh;overflow:auto;margin:auto">

    <!-- Header -->
    <div style="padding:22px 22px 0;display:flex;justify-content:space-between;align-items:center">
      <button x-show="addEntry.type" @click="addEntry.type=null"
        style="background:none;border:none;cursor:pointer;font-size:14px;font-weight:500;color:#007AFF;padding:0;font-family:inherit">
        ← Back
      </button>
      <span x-show="!addEntry.type"></span>
      <button @click="addEntry.open=false"
        style="width:30px;height:30px;border-radius:50%;background:#F0EFEC;border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center">✕</button>
    </div>

    <!-- Title -->
    <div style="padding:14px 24px 20px">
      <h2 style="font-size:22px;font-weight:700;letter-spacing:-0.5px;color:#1A1917;margin:0"
          x-text="addEntry.type ? typeLabel(addEntry.type) : 'New Entry'"></h2>
      <p x-show="!addEntry.type" style="font-size:14px;color:#ABAAA5;margin:5px 0 0">Choose what to add</p>
    </div>

    <!-- ── Step 1: Type picker ── -->
    <div x-show="!addEntry.type" style="padding:8px 20px 32px;display:flex;flex-direction:column;gap:14px">
      <button @click="addEntry.type='task'"
        style="display:flex;align-items:center;gap:16px;padding:18px 20px;border:1.5px solid #EBEBEB;border-radius:18px;background:#fff;cursor:pointer;text-align:left;width:100%;transition:all .15s;font-family:inherit"
        onmouseover="this.style.background='#F6F5F2';this.style.borderColor='#B0AFAA';this.style.boxShadow='0 4px 12px rgba(0,0,0,0.07)'"
        onmouseout="this.style.background='#fff';this.style.borderColor='#EBEBEB';this.style.boxShadow='none'">
        <span style="width:48px;height:48px;background:#EEF2FF;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">✅</span>
        <div style="flex:1">
          <p style="font-size:15px;font-weight:600;color:#1A1917;margin:0">Task</p>
          <p style="font-size:13px;color:#ABAAA5;margin:3px 0 0">Track a to-do or reminder</p>
        </div>
        <span style="color:#C8C7C3;font-size:20px;font-weight:300">›</span>
      </button>

      <button @click="addEntry.type='journal'; addEntry.journalDate=todayStr()"
        style="display:flex;align-items:center;gap:16px;padding:18px 20px;border:1.5px solid #EBEBEB;border-radius:18px;background:#fff;cursor:pointer;text-align:left;width:100%;transition:all .15s;font-family:inherit"
        onmouseover="this.style.background='#F6F5F2';this.style.borderColor='#B0AFAA';this.style.boxShadow='0 4px 12px rgba(0,0,0,0.07)'"
        onmouseout="this.style.background='#fff';this.style.borderColor='#EBEBEB';this.style.boxShadow='none'">
        <span style="width:48px;height:48px;background:#ECFDF5;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">📓</span>
        <div style="flex:1">
          <p style="font-size:15px;font-weight:600;color:#1A1917;margin:0">Journal</p>
          <p style="font-size:13px;color:#ABAAA5;margin:3px 0 0">Write a journal entry</p>
        </div>
        <span style="color:#C8C7C3;font-size:20px;font-weight:300">›</span>
      </button>

      <button @click="addEntry.type='document'"
        style="display:flex;align-items:center;gap:16px;padding:18px 20px;border:1.5px solid #EBEBEB;border-radius:18px;background:#fff;cursor:pointer;text-align:left;width:100%;transition:all .15s;font-family:inherit"
        onmouseover="this.style.background='#F6F5F2';this.style.borderColor='#B0AFAA';this.style.boxShadow='0 4px 12px rgba(0,0,0,0.07)'"
        onmouseout="this.style.background='#fff';this.style.borderColor='#EBEBEB';this.style.boxShadow='none'">
        <span style="width:48px;height:48px;background:#FFFBEB;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">📄</span>
        <div style="flex:1">
          <p style="font-size:15px;font-weight:600;color:#1A1917;margin:0">Document</p>
          <p style="font-size:13px;color:#ABAAA5;margin:3px 0 0">Upload a file</p>
        </div>
        <span style="color:#C8C7C3;font-size:20px;font-weight:300">›</span>
      </button>
    </div>

    <!-- ── Step 2a: Task form ── -->
    <div x-show="addEntry.type==='task'" style="padding:0 24px 28px">
      <div style="display:flex;flex-direction:column;gap:14px">
        <div>
          <label class="field-label">Title *</label>
          <input x-model="addEntry.taskTitle" class="input" placeholder="What needs to be done?" />
        </div>
        <div>
          <label class="field-label">Description</label>
          <textarea x-model="addEntry.taskDesc" class="input" rows="2" placeholder="Optional details…"></textarea>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div>
            <label class="field-label">Priority</label>
            <select x-model="addEntry.taskPriority" class="input">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
            </select>
          </div>
          <div>
            <label class="field-label">Status</label>
            <select x-model="addEntry.taskStatus" class="input">
              <option value="todo">Todo</option>
              <option value="in_progress">In Progress</option>
              <option value="done">Done</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
        </div>
        <div>
          <label class="field-label">Due date</label>
          <input type="datetime-local" x-model="addEntry.taskDueDate" class="input"
                 @change="if(addEntry.taskDueDate && addEntry.taskDueDate.length===10) addEntry.taskDueDate += 'T23:59'; else if(addEntry.taskDueDate && addEntry.taskDueDate.endsWith('T00:00')) addEntry.taskDueDate = addEntry.taskDueDate.slice(0,10) + 'T23:59'" />
        </div>
        <div>
          <label class="field-label">Tags (comma-separated)</label>
          <input x-model="addEntry.taskTags" class="input" placeholder="work, health, personal" />
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px">
        <button @click="addEntry.open=false" class="btn btn-secondary">Cancel</button>
        <button @click="saveEntry()" :disabled="addEntry.saving || !addEntry.taskTitle.trim()" class="btn btn-primary"
                :style="(addEntry.saving || !addEntry.taskTitle.trim()) ? 'opacity:.5;cursor:not-allowed' : ''">
          <span x-text="addEntry.saving ? 'Saving…' : 'Save Task'"></span>
        </button>
      </div>
    </div>

    <!-- ── Step 2b: Journal form ── -->
    <div x-show="addEntry.type==='journal'" style="padding:0 16px 28px">
      <div style="background:#F6F5F2;border-radius:16px;overflow:hidden;margin-bottom:12px">
        <div style="padding:13px 16px">
          <p style="font-size:11px;font-weight:600;color:#ABAAA5;text-transform:uppercase;letter-spacing:.5px;margin:0 0 5px">Date</p>
          <input type="date" x-model="addEntry.journalDate"
            style="width:100%;border:none;background:none;font-size:15px;color:#1A1917;outline:none;font-family:inherit;padding:0" />
        </div>
        <div style="height:1px;background:#ECEAE5"></div>
        <div style="padding:13px 16px">
          <p style="font-size:11px;font-weight:600;color:#ABAAA5;text-transform:uppercase;letter-spacing:.5px;margin:0 0 5px">Title</p>
          <input x-model="addEntry.journalTitle"
            style="width:100%;border:none;background:none;font-size:15px;color:#1A1917;outline:none;font-family:inherit;padding:0"
            placeholder="Give this entry a title…" />
        </div>
        <div style="height:1px;background:#ECEAE5"></div>
        <div style="padding:13px 16px">
          <p style="font-size:11px;font-weight:600;color:#ABAAA5;text-transform:uppercase;letter-spacing:.5px;margin:0 0 5px">Entry</p>
          <textarea x-model="addEntry.journalContent" rows="5"
            style="width:100%;border:none;background:none;font-size:15px;color:#1A1917;outline:none;resize:none;font-family:inherit;padding:0;line-height:1.6"
            placeholder="What's on your mind?"></textarea>
        </div>
      </div>

      <div style="background:#F6F5F2;border-radius:16px;padding:13px 16px;margin-bottom:20px">
        <p style="font-size:11px;font-weight:600;color:#ABAAA5;text-transform:uppercase;letter-spacing:.5px;margin:0 0 5px">Mood</p>
        <select x-model="addEntry.journalMood"
          style="width:100%;border:none;background:none;font-size:15px;color:#1A1917;outline:none;font-family:inherit;cursor:pointer;appearance:none;padding:0">
          <option value="">Not set</option>
          <option value="great">😄 Great</option>
          <option value="good">🙂 Good</option>
          <option value="neutral">😐 Neutral</option>
          <option value="low">😔 Low</option>
          <option value="stressed">😤 Stressed</option>
        </select>
      </div>

      <button @click="saveEntry()" :disabled="addEntry.saving || !addEntry.journalContent.trim()"
        style="width:100%;height:52px;background:#1A1917;color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .12s"
        :style="(addEntry.saving || !addEntry.journalContent.trim()) ? 'opacity:.4;cursor:not-allowed' : 'opacity:1'">
        <span x-text="addEntry.saving ? 'Saving…' : 'Save Entry'"></span>
      </button>
      <button @click="addEntry.open=false"
        style="width:100%;height:42px;background:none;border:none;font-size:14px;color:#ABAAA5;cursor:pointer;font-family:inherit;margin-top:4px">
        Cancel
      </button>
    </div>

    <!-- ── Step 2c: Document form ── -->
    <div x-show="addEntry.type==='document'" style="padding:0 16px 28px">
      <div style="border:2px dashed #DCDBD7;border-radius:16px;padding:32px 16px;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:12px"
           :style="addEntry.docFile ? 'border-color:#1A1917;border-style:solid;background:#F6F5F2' : ''"
           @dragover.prevent @drop.prevent="addEntry.docFile=$event.dataTransfer.files[0]"
           @click="$refs.docInput.click()">
        <input type="file" x-ref="docInput" accept=".pdf,.docx,.txt,.md"
               @change="addEntry.docFile=$event.target.files[0]" style="display:none" />
        <template x-if="!addEntry.docFile">
          <div>
            <div style="width:52px;height:52px;background:#ECEAE5;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 12px">📁</div>
            <p style="font-size:15px;font-weight:500;color:#1A1917;margin:0 0 5px">Drop a file here</p>
            <p style="font-size:13px;color:#ABAAA5;margin:0">or click to browse · PDF, DOCX, TXT, MD</p>
          </div>
        </template>
        <template x-if="addEntry.docFile">
          <div>
            <div style="width:52px;height:52px;background:#ECEAE5;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 12px">📄</div>
            <p style="font-size:15px;font-weight:600;color:#1A1917;margin:0 0 4px" x-text="addEntry.docFile.name"></p>
            <p style="font-size:13px;color:#ABAAA5;margin:0">Tap to change</p>
          </div>
        </template>
      </div>

      <div style="background:#F6F5F2;border-radius:16px;padding:13px 16px;margin-bottom:20px">
        <p style="font-size:11px;font-weight:600;color:#ABAAA5;text-transform:uppercase;letter-spacing:.5px;margin:0 0 5px">Description</p>
        <input x-model="addEntry.docDesc"
          style="width:100%;border:none;background:none;font-size:15px;color:#1A1917;outline:none;font-family:inherit;padding:0"
          placeholder="Optional…" />
      </div>

      <button @click="saveEntry()" :disabled="addEntry.saving || !addEntry.docFile"
        style="width:100%;height:52px;background:#1A1917;color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .12s"
        :style="(addEntry.saving || !addEntry.docFile) ? 'opacity:.4;cursor:not-allowed' : 'opacity:1'">
        <span x-text="addEntry.saving ? 'Uploading…' : 'Upload Document'"></span>
      </button>
      <button @click="addEntry.open=false"
        style="width:100%;height:42px;background:none;border:none;font-size:14px;color:#ABAAA5;cursor:pointer;font-family:inherit;margin-top:4px">
        Cancel
      </button>
    </div>

  </div>
</div>

<script src="/static/js/app.js"></script>
<script>
  function dashboardApp() {
    return {
      briefing: null,
      dayModal: null,
      journalDetail: null,
      todaySummary: null,
      financeDaily: null,
      financeGoals: [],
      calendarObj: null,
      username: '',
      addEntry: {
        open: false, type: null, saving: false,
        taskTitle: '', taskDesc: '', taskPriority: 'medium', taskStatus: 'todo', taskDueDate: '', taskTags: '',
        journalTitle: '', journalContent: '', journalMood: '', journalDate: '',
        docFile: null, docDesc: '',
      },

      get todayLabel() {
        return new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      },

      get financeNetRows() {
        if (!this.financeDaily) return [];
        const inc = this.financeDaily.income_by_currency || {};
        const exp = this.financeDaily.expense_by_currency || {};
        const currencies = new Set([...Object.keys(inc), ...Object.keys(exp)]);
        return [...currencies].map(cur => ({ cur, net: (inc[cur] || 0) - (exp[cur] || 0) }));
      },

      get financeRowLabel() {
        const rows = this.financeNetRows;
        if (!rows.length) return '';
        return rows.map(r => {
          const sign = r.net >= 0 ? '+' : '−';
          return `${sign}${Math.abs(r.net).toLocaleString()} ${r.cur}`;
        }).join(' · ');
      },

      get briefingTeaser() {
        if (!this.briefing) return '';
        const m = this.briefing.match(/^.+?[.!?]/);
        return m ? m[0] : this.briefing.slice(0, 120);
      },

      get dayModalFinanceNet() {
        const f = this.dayModal?.finance;
        if (!f) return [];
        const inc = f.income_by_currency || {};
        const exp = f.expense_by_currency || {};
        const currencies = new Set([...Object.keys(inc), ...Object.keys(exp)]);
        return [...currencies].map(cur => ({ cur, net: (inc[cur] || 0) - (exp[cur] || 0) }));
      },

      get activeGoalsWithGap() {
        return (this.financeGoals || [])
          .filter(g => g.status === 'active')
          .map(g => ({
            title: g.title,
            goal_type: g.goal_type,
            currency: g.currency,
            gap: g.target_amount - (g.current_amount || 0),
            progress_pct: g.progress_pct || 0,
            status_label: g.status_label || '',
          }));
      },

      todayStr() {
        return new Date().toISOString().slice(0, 10);
      },

      typeLabel(t) {
        return { task: 'New Task', journal: 'New Journal Entry', document: 'Upload Document' }[t] || '';
      },

      async init() {
        requireAuth();
        API.get('/users/me').then(u => { this.username = u.username || ''; }).catch(() => {});
        this.initCalendar();
        this.loadTodaySummary();
      },

      async loadTodaySummary() {
        try {
          this.todaySummary = await API.get('/calendar/today');
        } catch(e) { console.error(e); }
        try {
          this.financeDaily = await API.get('/finance/daily');
        } catch {}
        try {
          this.financeGoals = (await API.get('/finance/goals')) || [];
        } catch {}
      },

      initCalendar() {
        const self = this;
        this.calendarObj = new FullCalendar.Calendar(document.getElementById('calendar'), {
          initialView: 'dayGridMonth',
          height: 'auto',
          headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,dayGridWeek' },
          eventSources: [{
            events: async (info, success, failure) => {
              try {
                const events = await API.get(`/calendar/events?start=${info.startStr.slice(0,10)}&end=${info.endStr.slice(0,10)}`);
                success(events);
              } catch(e) { failure(e); }
            },
          }],
          dateClick: (info) => self.openDayModal(info.dateStr),
          eventClick: (info) => {
            const { type } = info.event.extendedProps;
            if (type === 'task')     { window.location.href = '/tasks';     return; }
            if (type === 'document') { window.location.href = '/documents'; return; }
            if (type === 'finance')  { window.location.href = '/finance';   return; }
            self.openDayModal(info.event.startStr.slice(0, 10));
          },
        });
        this.calendarObj.render();
      },

      async openDayModal(dateStr) {
        try {
          this.dayModal = await API.get(`/calendar/day-detail?day=${dateStr}`);
        } catch(e) { console.error(e); }
      },

      openJournalDetail(j) {
        this.journalDetail = j;
      },

      async loadBriefing() {
        try {
          const r = await API.get('/briefing/');
          this.briefing = r.briefing;
        } catch(e) { alert('Failed to load briefing: ' + e.message); }
      },

      openAddEntry() {
        this.addEntry = {
          open: true, type: null, saving: false,
          taskTitle: '', taskDesc: '', taskPriority: 'medium', taskStatus: 'todo', taskDueDate: '', taskTags: '',
          journalTitle: '', journalContent: '', journalMood: '', journalDate: this.todayStr(),
          docFile: null, docDesc: '',
        };
      },

      async saveEntry() {
        this.addEntry.saving = true;
        try {
          if (this.addEntry.type === 'task') {
            await API.post('/tasks/', {
              title: this.addEntry.taskTitle.trim(),
              description: this.addEntry.taskDesc || null,
              priority: this.addEntry.taskPriority,
              status: this.addEntry.taskStatus,
              due_date: this.addEntry.taskDueDate || null,
              tags: this.addEntry.taskTags ? this.addEntry.taskTags.split(',').map(t => t.trim()).filter(Boolean) : [],
            });
          } else if (this.addEntry.type === 'journal') {
            await API.post('/journal/', {
              title: this.addEntry.journalTitle || null,
              content: this.addEntry.journalContent,
              mood: this.addEntry.journalMood || null,
              entry_date: this.addEntry.journalDate,
              source: 'web',
            });
          } else if (this.addEntry.type === 'document' && this.addEntry.docFile) {
            const fd = new FormData();
            fd.append('file', this.addEntry.docFile);
            fd.append('source', 'web');
            if (this.addEntry.docDesc) fd.append('description', this.addEntry.docDesc);
            await API.upload('/documents/', fd);
          }
          this.addEntry.open = false;
          this.calendarObj.refetchEvents();
          this.loadTodaySummary();
        } catch(e) {
          alert('Failed to save: ' + e.message);
        } finally {
          this.addEntry.saving = false;
        }
      },

      priorityColor(p) {
        return { urgent: '#ef4444', high: '#f97316', medium: '#3b82f6', low: '#6b7280' }[p] || '#3b82f6';
      },

      statusIcon(s) {
        return { todo: '⏳', in_progress: '🔄', done: '✅', cancelled: '❌' }[s] || '⏳';
      },

      moodIcon(m) {
        return { great: '😄', good: '🙂', neutral: '😐', low: '😔', stressed: '😤' }[m] || '';
      },

      async deleteEntry(type, id) {
        const labels = { journal: 'journal entry', task: 'task', document: 'document' };
        if (!confirm(`Delete this ${labels[type]}?`)) return;
        const routes = { journal: `/journal/${id}`, task: `/tasks/${id}`, document: `/documents/${id}` };
        try {
          await API.delete(routes[type]);
          const dateStr = this.dayModal?.date;
          this.dayModal = null;
          if (dateStr) {
            const parsed = new Date(dateStr);
            const iso = parsed.toISOString().slice(0, 10);
            const updated = await API.get(`/calendar/day-detail?day=${iso}`);
            const hasItems = updated?.journal?.length || updated?.tasks?.length || updated?.documents?.length;
            if (hasItems) this.dayModal = updated;
          }
          this.calendarObj.refetchEvents();
          this.loadTodaySummary();
        } catch(e) { alert('Delete failed: ' + e.message); }
      },

      logout,
    };
  }
</script>
</body>
</html>
