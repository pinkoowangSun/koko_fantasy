<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koko — Documents</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="docsApp()" x-init="init()">

<div class="page-shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo" x-text="username ? 'Hi, ' + username + '!' : 'Hi there!'"></div>
    <nav style="display:flex;flex-direction:column;gap:2px">
      <a href="/dashboard" class="nav-link"><span class="nav-icon">📅</span><span class="nav-label">Daily Tracker</span></a>
      <a href="/tasks"     class="nav-link"><span class="nav-icon">✅</span><span class="nav-label">Tasks</span></a>
      <a href="/workout"   class="nav-link"><span class="nav-icon">🏋️</span><span class="nav-label">Workout</span></a>
      <a href="/documents" class="nav-link active"><span class="nav-icon">📄</span><span class="nav-label">Documents</span></a>
      <a href="/profile"   class="nav-link"><span class="nav-icon">👤</span><span class="nav-label">Profile</span></a>
    </nav>
    <div style="flex:1"></div>
    <button @click="logout()" class="nav-link danger"><span class="nav-icon">←</span><span class="nav-label">Sign out</span></button>
  </aside>

  <!-- Main -->
  <main class="page-main">

    <div class="page-header">
      <h1 class="page-title">Documents</h1>
    </div>

    <!-- Upload -->
    <div class="card" style="margin-bottom:20px">
      <p style="font-size:14px;font-weight:600;color:#1A1917;margin-bottom:12px">Upload a Document</p>
      <div style="border:2px dashed #D6D5D0;border-radius:12px;padding:32px;text-align:center;cursor:pointer;transition:all .12s"
           :style="uploadFile ? 'border-color:#1A1917;background:#F6F5F2' : ''"
           @dragover.prevent @drop.prevent="uploadFile=$event.dataTransfer.files[0]"
           @click="document.getElementById('file-input').click()">
        <input type="file" id="file-input" style="display:none" accept=".pdf,.docx,.txt,.md" @change="handleFileSelect($event)" />
        <template x-if="!uploadFile">
          <div>
            <p style="font-size:28px;margin-bottom:8px">📁</p>
            <p style="font-size:14px;color:#78776E">Drop a file or <span style="color:#1A1917;font-weight:500">browse</span></p>
            <p style="font-size:12px;color:#ABAAA5;margin-top:4px">PDF, DOCX, TXT, MD</p>
          </div>
        </template>
        <template x-if="uploadFile">
          <div>
            <p style="font-size:14px;font-weight:500;color:#1A1917" x-text="uploadFile.name"></p>
            <p style="font-size:12px;color:#78776E;margin-top:4px">Click to change file</p>
          </div>
        </template>
      </div>
      <template x-if="uploadFile">
        <div style="display:flex;align-items:center;gap:10px;margin-top:12px">
          <input x-model="uploadDesc" class="input" placeholder="Description (optional)" style="flex:1" />
          <button @click="uploadDocument()" :disabled="uploading" class="btn btn-primary">
            <span x-text="uploading ? 'Uploading…' : 'Upload'"></span>
          </button>
          <button @click="uploadFile=null" class="btn btn-ghost btn-sm">✕</button>
        </div>
      </template>
    </div>

    <!-- Document list -->
    <div class="card" style="margin-bottom:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <p style="font-size:14px;font-weight:600;color:#1A1917;margin-bottom:14px">
          Files <span style="font-weight:400;color:#78776E" x-text="'(' + docs.length + ')'"></span>
        </p>
      </div>
      <template x-if="docs.length===0">
        <p style="text-align:center;color:#ABAAA5;font-size:14px;padding:32px 0">No documents yet.</p>
      </template>
      <div>
        <template x-for="doc in docs" :key="doc.id">
          <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F3F4F6"
               class="doc-row">
            <span style="font-size:22px;flex-shrink:0">📄</span>
            <div style="flex:1;min-width:0">
              <p style="font-size:13.5px;font-weight:500;color:#1A1917;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="doc.original_name"></p>
              <p style="font-size:12px;color:#ABAAA5;margin-top:2px">
                <span x-text="fmtSize(doc.file_size)"></span>
                · <span x-text="doc.source==='telegram' ? 'Telegram' : 'Web'"></span>
                · <span x-text="fmtDate(doc.created_at)"></span>
                · <span :style="doc.indexed ? 'color:#10B981' : 'color:#ABAAA5'" x-text="doc.indexed ? 'Indexed' : 'Not indexed'"></span>
              </p>
              <template x-if="doc.description">
                <p style="font-size:12px;color:#78776E;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="doc.description"></p>
              </template>
            </div>
            <button @click="deleteDoc(doc.id)" class="btn btn-ghost btn-sm doc-delete" style="color:#DC2626;opacity:0;transition:opacity .12s">🗑</button>
          </div>
        </template>
      </div>
    </div>

    <!-- Q&A -->
    <div class="card">
      <p style="font-size:14px;font-weight:600;color:#1A1917;margin-bottom:12px">Ask About Your Documents</p>
      <div style="display:flex;gap:8px">
        <input x-model="question" @keydown.enter="askQuestion()" class="input"
               placeholder="Ask anything about your documents…" />
        <button @click="askQuestion()" :disabled="asking" class="btn btn-primary" style="flex-shrink:0">
          <span x-text="asking ? '…' : 'Ask'"></span>
        </button>
      </div>
      <template x-if="answer">
        <div style="margin-top:16px;background:#F6F5F2;border:1px solid #E8E7E3;border-radius:10px;padding:16px">
          <p style="font-size:12px;font-weight:600;color:#78776E;margin-bottom:6px">Answer</p>
          <p style="font-size:13.5px;color:#1A1917;line-height:1.7;white-space:pre-wrap" x-text="answer"></p>
        </div>
      </template>
    </div>

  </main>
</div>

<style>
  .doc-row:hover .doc-delete { opacity: 1 !important; }
  .doc-row:last-child { border-bottom: none; }
</style>

<script src="/static/js/app.js"></script>
<script>
  function docsApp() {
    return {
      username: '',
      docs: [], uploadFile: null, uploadDesc: '', uploading: false,
      question: '', answer: null, asking: false,

      async init() {
        requireAuth();
        API.get('/users/me').then(u => { this.username = u.username || ''; }).catch(() => {});
        await this.loadDocs();
      },
      async loadDocs() { this.docs = await API.get('/documents/'); },

      handleFileSelect(e) { this.uploadFile = e.target.files[0] || null; },

      async uploadDocument() {
        if (!this.uploadFile || this.uploading) return;
        this.uploading = true;
        try {
          const fd = new FormData();
          fd.append('file', this.uploadFile);
          fd.append('source', 'web');
          if (this.uploadDesc) fd.append('description', this.uploadDesc);
          await API.upload('/documents/', fd);
          this.uploadFile = null;
          this.uploadDesc = '';
          document.getElementById('file-input').value = '';
          await this.loadDocs();
        } catch(e) { alert('Upload failed: ' + e.message); }
        finally { this.uploading = false; }
      },

      async deleteDoc(id) {
        if (!confirm('Delete this document?')) return;
        await API.delete(`/documents/${id}`);
        await this.loadDocs();
      },

      async askQuestion() {
        if (!this.question.trim() || this.asking) return;
        this.asking = true; this.answer = null;
        try {
          const r = await API.post('/documents/qa', { question: this.question });
          this.answer = r.answer;
        } catch(e) { this.answer = 'Error: ' + e.message; }
        finally { this.asking = false; }
      },

      fmtSize(bytes) {
        if (!bytes) return '';
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
        return (bytes/1048576).toFixed(1) + ' MB';
      },

      fmtDate, logout,
    };
  }
</script>
</body>
</html>
