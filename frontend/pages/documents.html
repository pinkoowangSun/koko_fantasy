<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koko — Documents</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="bg-gray-50 min-h-screen" x-data="docsApp()" x-init="init()">

  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-56 bg-white border-r border-gray-100 flex flex-col p-4 gap-1 shrink-0">
      <div class="text-xl font-bold text-indigo-600 mb-6 px-2">🪄 Koko</div>
      <a href="/dashboard" class="nav-link">📅 Daily Tracker</a>
      <a href="/tasks"     class="nav-link">✅ Tasks</a>
      <a href="/documents" class="nav-link active">📄 Documents</a>
      <a href="/profile"   class="nav-link">👤 Profile</a>
      <div class="flex-1"></div>
      <button @click="logout()" class="nav-link text-red-500 hover:bg-red-50 hover:text-red-600">🚪 Logout</button>
    </aside>

    <!-- Main -->
    <main class="flex-1 overflow-y-auto p-6">
      <h1 class="text-2xl font-bold text-gray-900 mb-6">Documents</h1>

      <!-- Upload area -->
      <div class="card mb-6">
        <h2 class="font-semibold text-gray-700 mb-3">Upload Document</h2>
        <div class="border-2 border-dashed border-gray-200 rounded-xl p-6 text-center hover:border-indigo-400 transition-colors"
             @dragover.prevent @drop.prevent="handleDrop($event)">
          <input type="file" id="file-input" class="hidden"
                 accept=".pdf,.docx,.txt,.md" @change="handleFileSelect($event)" />
          <label for="file-input" class="cursor-pointer">
            <div class="text-3xl mb-2">📥</div>
            <p class="text-gray-500 text-sm">Drop a file here or <span class="text-indigo-600 font-medium">browse</span></p>
            <p class="text-xs text-gray-400 mt-1">PDF, DOCX, TXT, MD supported</p>
          </label>
        </div>
        <template x-if="uploadFile">
          <div class="mt-3 flex items-center gap-3">
            <span class="text-sm text-gray-700 flex-1" x-text="uploadFile.name"></span>
            <input x-model="uploadDesc" placeholder="Description (optional)"
              class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 flex-1 focus:outline-none focus:ring-2 focus:ring-indigo-400" />
            <button @click="uploadDocument()"
              :disabled="uploading"
              class="bg-indigo-600 text-white px-4 py-1.5 rounded-lg text-sm font-medium hover:bg-indigo-700 disabled:opacity-50">
              <span x-text="uploading ? 'Uploading…' : 'Upload'"></span>
            </button>
          </div>
        </template>
      </div>

      <!-- Document list -->
      <div class="card mb-6">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-semibold text-gray-700">All Documents (<span x-text="docs.length"></span>)</h2>
        </div>
        <template x-if="docs.length === 0">
          <p class="text-gray-400 text-sm text-center py-6">No documents yet. Upload one above.</p>
        </template>
        <div class="space-y-2">
          <template x-for="doc in docs" :key="doc.id">
            <div class="flex items-center gap-3 py-2 border-b border-gray-50 last:border-0 group">
              <span class="text-xl">📄</span>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium text-gray-800 truncate" x-text="doc.original_name"></p>
                <p class="text-xs text-gray-400">
                  <span x-text="fmtSize(doc.file_size)"></span> ·
                  <span x-text="doc.source === 'telegram' ? '📱 Telegram' : '🌐 Web'"></span> ·
                  <span x-text="fmtDate(doc.created_at)"></span>
                  <span x-text="doc.indexed ? ' · ✅ Indexed' : ' · ⏳ Not indexed'" class="ml-1"></span>
                </p>
                <template x-if="doc.description">
                  <p class="text-xs text-gray-500 truncate" x-text="doc.description"></p>
                </template>
              </div>
              <button @click="deleteDoc(doc.id)"
                class="text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all p-1">🗑️</button>
            </div>
          </template>
        </div>
      </div>

      <!-- Q&A -->
      <div class="card">
        <h2 class="font-semibold text-gray-700 mb-3">🔍 Ask About Your Documents</h2>
        <div class="flex gap-2">
          <input x-model="question" @keydown.enter="askQuestion()"
            placeholder="Ask anything about your documents…"
            class="flex-1 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
          <button @click="askQuestion()" :disabled="asking"
            class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 disabled:opacity-50">
            <span x-text="asking ? '…' : 'Ask'"></span>
          </button>
        </div>
        <template x-if="answer">
          <div class="mt-4 bg-indigo-50 rounded-xl p-4">
            <p class="text-xs text-indigo-500 font-semibold mb-1">Answer</p>
            <p class="text-sm text-gray-700 whitespace-pre-wrap" x-text="answer"></p>
          </div>
        </template>
      </div>
    </main>
  </div>

  <script src="/static/js/app.js"></script>
  <script>
    function docsApp() {
      return {
        docs: [],
        uploadFile: null,
        uploadDesc: '',
        uploading: false,
        question: '',
        answer: null,
        asking: false,

        async init() {
          requireAuth();
          await this.loadDocs();
        },

        async loadDocs() {
          this.docs = await API.get('/documents/');
        },

        handleFileSelect(e) {
          this.uploadFile = e.target.files[0] || null;
        },

        handleDrop(e) {
          this.uploadFile = e.dataTransfer.files[0] || null;
        },

        async uploadDocument() {
          if (!this.uploadFile || this.uploading) return;
          this.uploading = true;
          try {
            const fd = new FormData();
            fd.append('file', this.uploadFile);
            fd.append('source', 'web');
            if (this.uploadDesc) fd.append('description', this.uploadDesc);
            await API.upload('/documents/', fd);
            this.uploadFile = null;
            this.uploadDesc = '';
            document.getElementById('file-input').value = '';
            await this.loadDocs();
          } catch (e) {
            alert('Upload failed: ' + e.message);
          } finally {
            this.uploading = false;
          }
        },

        async deleteDoc(id) {
          if (!confirm('Delete this document?')) return;
          await API.delete(`/documents/${id}`);
          await this.loadDocs();
        },

        async askQuestion() {
          if (!this.question.trim() || this.asking) return;
          this.asking = true;
          this.answer = null;
          try {
            const result = await API.post('/documents/qa', { question: this.question });
            this.answer = result.answer;
          } catch (e) {
            this.answer = 'Error: ' + e.message;
          } finally {
            this.asking = false;
          }
        },

        fmtSize(bytes) {
          if (!bytes) return '';
          if (bytes < 1024) return bytes + ' B';
          if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
          return (bytes / 1024 / 1024).toFixed(1) + ' MB';
        },

        fmtDate, logout,
      };
    }
  </script>
</body>
</html>
