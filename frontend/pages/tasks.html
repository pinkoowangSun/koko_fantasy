<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koko — Tasks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="bg-gray-50 min-h-screen" x-data="tasksApp()" x-init="init()">

  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-56 bg-white border-r border-gray-100 flex flex-col p-4 gap-1 shrink-0">
      <div class="text-xl font-bold text-indigo-600 mb-6 px-2">🪄 Koko</div>
      <a href="/dashboard" class="nav-link">📅 Daily Tracker</a>
      <a href="/tasks"     class="nav-link active">✅ Tasks</a>
      <a href="/documents" class="nav-link">📄 Documents</a>
      <a href="/profile"   class="nav-link">👤 Profile</a>
      <div class="flex-1"></div>
      <button @click="logout()" class="nav-link text-red-500 hover:bg-red-50 hover:text-red-600">🚪 Logout</button>
    </aside>

    <!-- Main -->
    <main class="flex-1 overflow-y-auto p-6">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Tasks</h1>
        <button @click="openCreate()"
          class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition-colors">
          + New Task
        </button>
      </div>

      <!-- Summary cards -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
        <template x-for="s in statuses" :key="s.key">
          <button @click="filter = s.key"
            :class="filter === s.key ? 'ring-2 ring-indigo-400' : ''"
            class="card text-center hover:shadow transition-shadow cursor-pointer">
            <div class="text-2xl mb-1" x-text="s.icon"></div>
            <div class="text-xl font-bold text-gray-900" x-text="countByStatus(s.key)"></div>
            <div class="text-xs text-gray-500 capitalize" x-text="s.label"></div>
          </button>
        </template>
      </div>

      <!-- Filter bar -->
      <div class="flex gap-2 mb-4 flex-wrap">
        <button x-for="s in allStatuses" :key="s.key" @click="filter = s.key"
          :class="filter === s.key ? 'bg-indigo-600 text-white' : 'bg-white text-gray-600 border border-gray-200'"
          class="px-3 py-1 rounded-full text-xs font-medium transition-colors hover:bg-indigo-50 hover:text-indigo-700"
          x-text="s.label">
        </button>
        <div class="flex gap-2 ml-auto">
          <select x-model="priorityFilter"
            class="text-xs border border-gray-200 rounded-lg px-2 py-1 text-gray-600">
            <option value="">All priorities</option>
            <option value="urgent">🔴 Urgent</option>
            <option value="high">🟠 High</option>
            <option value="medium">🟡 Medium</option>
            <option value="low">🟢 Low</option>
          </select>
        </div>
      </div>

      <!-- Task list -->
      <div class="space-y-3">
        <template x-if="filteredTasks.length === 0">
          <p class="text-gray-400 text-center py-10">No tasks here.</p>
        </template>
        <template x-for="task in filteredTasks" :key="task.id">
          <div class="card flex items-start gap-3 group">
            <button @click="toggleStatus(task)"
              class="text-xl mt-0.5 shrink-0 hover:scale-110 transition-transform"
              :title="task.status === 'done' ? 'Mark todo' : 'Mark done'"
              x-text="statusIcon(task.status)">
            </button>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="font-medium text-gray-900"
                  :class="task.status === 'done' ? 'line-through text-gray-400' : ''"
                  x-text="task.title"></span>
                <span x-html="priorityBadge(task.priority)"></span>
                <template x-if="task.tags && task.tags.length">
                  <template x-for="tag in task.tags" :key="tag">
                    <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full" x-text="tag"></span>
                  </template>
                </template>
              </div>
              <template x-if="task.description">
                <p class="text-sm text-gray-500 mt-0.5 truncate" x-text="task.description"></p>
              </template>
              <div class="flex gap-3 mt-1 text-xs text-gray-400">
                <template x-if="task.due_date">
                  <span>📅 Due: <span x-text="fmtDate(task.due_date)"></span></span>
                </template>
                <template x-if="task.reminder_at">
                  <span>⏰ Reminder: <span x-text="fmtDate(task.reminder_at)"></span></span>
                </template>
              </div>
            </div>
            <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity shrink-0">
              <button @click="openEdit(task)" class="p-1 text-gray-400 hover:text-indigo-600" title="Edit">✏️</button>
              <button @click="deleteTask(task.id)" class="p-1 text-gray-400 hover:text-red-500" title="Delete">🗑️</button>
            </div>
          </div>
        </template>
      </div>
    </main>
  </div>

  <!-- Create / Edit Modal -->
  <div x-show="form.open" x-cloak class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4"
       @click.self="form.open = false">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
      <h2 class="text-lg font-bold mb-4" x-text="form.id ? 'Edit Task' : 'New Task'"></h2>
      <div class="space-y-3">
        <input x-model="form.title" placeholder="Task title *"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        <textarea x-model="form.description" placeholder="Description (optional)" rows="2"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 resize-none"></textarea>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-gray-500 mb-1 block">Priority</label>
            <select x-model="form.priority"
              class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
              <option value="low">🟢 Low</option>
              <option value="medium" selected>🟡 Medium</option>
              <option value="high">🟠 High</option>
              <option value="urgent">🔴 Urgent</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-gray-500 mb-1 block">Status</label>
            <select x-model="form.status"
              class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
              <option value="todo">⏳ Todo</option>
              <option value="in_progress">🔄 In Progress</option>
              <option value="done">✅ Done</option>
              <option value="cancelled">❌ Cancelled</option>
            </select>
          </div>
        </div>
        <div>
          <label class="text-xs text-gray-500 mb-1 block">Due date</label>
          <input type="datetime-local" x-model="form.due_date"
            class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="text-xs text-gray-500 mb-1 block">Tags (comma-separated)</label>
          <input x-model="form.tagsRaw" placeholder="work, health, personal"
            class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-5">
        <button @click="form.open = false"
          class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg">Cancel</button>
        <button @click="saveTask()"
          class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium">
          Save
        </button>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  <script>
    function tasksApp() {
      return {
        tasks: [],
        filter: 'todo',
        priorityFilter: '',
        form: { open: false, id: null, title: '', description: '', priority: 'medium', status: 'todo', due_date: '', tagsRaw: '' },

        statuses: [
          { key: 'todo',        label: 'Todo',        icon: '⏳' },
          { key: 'in_progress', label: 'In Progress',  icon: '🔄' },
          { key: 'done',        label: 'Done',         icon: '✅' },
          { key: 'cancelled',   label: 'Cancelled',    icon: '❌' },
        ],

        get allStatuses() {
          return [{ key: '', label: 'All' }, ...this.statuses];
        },

        get filteredTasks() {
          return this.tasks.filter(t => {
            if (this.filter && t.status !== this.filter) return false;
            if (this.priorityFilter && t.priority !== this.priorityFilter) return false;
            return true;
          });
        },

        countByStatus(status) {
          return this.tasks.filter(t => t.status === status).length;
        },

        statusIcon(s) { return { todo: '⏳', in_progress: '🔄', done: '✅', cancelled: '❌' }[s] || '⏳'; },
        priorityBadge(p) { return PRIORITY_BADGE[p] || ''; },

        async init() {
          requireAuth();
          await this.loadTasks();
        },

        async loadTasks() {
          this.tasks = await API.get('/tasks/');
        },

        openCreate() {
          this.form = { open: true, id: null, title: '', description: '', priority: 'medium', status: 'todo', due_date: '', tagsRaw: '' };
        },

        openEdit(task) {
          this.form = {
            open: true,
            id: task.id,
            title: task.title,
            description: task.description || '',
            priority: task.priority,
            status: task.status,
            due_date: task.due_date ? task.due_date.slice(0, 16) : '',
            tagsRaw: (task.tags || []).join(', '),
          };
        },

        async saveTask() {
          if (!this.form.title.trim()) return;
          const payload = {
            title: this.form.title.trim(),
            description: this.form.description || null,
            priority: this.form.priority,
            status: this.form.status,
            due_date: this.form.due_date || null,
            tags: this.form.tagsRaw ? this.form.tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [],
          };
          try {
            if (this.form.id) {
              await API.patch(`/tasks/${this.form.id}`, payload);
            } else {
              await API.post('/tasks/', payload);
            }
            this.form.open = false;
            await this.loadTasks();
          } catch (e) {
            alert('Save failed: ' + e.message);
          }
        },

        async toggleStatus(task) {
          const next = task.status === 'done' ? 'todo' : 'done';
          await API.patch(`/tasks/${task.id}`, { status: next });
          await this.loadTasks();
        },

        async deleteTask(id) {
          if (!confirm('Delete this task?')) return;
          await API.delete(`/tasks/${id}`);
          await this.loadTasks();
        },

        fmtDate, logout,
      };
    }
  </script>
</body>
</html>
