<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koko — Tasks</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="tasksApp()" x-init="init()">

<div class="page-shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
  <span class="sidebar-logo-mark">✦</span>
  <span class="sidebar-logo-text" x-text="username ? 'Hi, ' + username + '!' : 'Hi there!'"></span>
</div>
    <nav style="display:flex;flex-direction:column;gap:2px">
      <a href="/dashboard" class="nav-link"><span class="nav-icon">📅</span><span class="nav-label">Daily Tracker</span></a>
      <a href="/tasks"     class="nav-link active"><span class="nav-icon">✅</span><span class="nav-label">Tasks</span></a>
      <a href="/journal"   class="nav-link"><span class="nav-icon">📓</span><span class="nav-label">Journal</span></a>
      <a href="/workout"   class="nav-link"><span class="nav-icon">🏋️</span><span class="nav-label">Workout</span></a>
      <a href="/finance"   class="nav-link"><span class="nav-icon">💰</span><span class="nav-label">Finance</span></a>
      <a href="/documents" class="nav-link"><span class="nav-icon">📄</span><span class="nav-label">Documents</span></a>
      <a href="/profile"   class="nav-link"><span class="nav-icon">👤</span><span class="nav-label">Profile</span></a>
    </nav>
    <div style="flex:1"></div>
    <button @click="logout()" class="nav-link danger"><span class="nav-icon">←</span><span class="nav-label">Sign out</span></button>
  </aside>

  <!-- Main -->
  <main class="page-main">

    <div class="page-header">
      <h1 class="page-title">Tasks</h1>
      <button @click="openCreate()" class="btn btn-primary">+ New Task</button>
    </div>
    <p style="font-size:13px;color:#ABAAA5;margin:-12px 0 20px">You can talk to Telegram bot <a href="https://t.me/TropicalKo" target="_blank" style="color:#ABAAA5;text-decoration:underline;text-underline-offset:2px">@TropicalKo</a> to add tasks directly!</p>

    <!-- Status summary -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px">
      <template x-for="s in statuses" :key="s.key">
        <button @click="filter=s.key"
          class="card"
          :style="filter===s.key ? 'border-color:#1A1917;box-shadow:0 0 0 2px rgba(26,25,23,.08)' : 'cursor:pointer'"
          style="text-align:center;cursor:pointer;transition:all .12s">
          <div style="font-size:20px;margin-bottom:4px" x-text="s.icon"></div>
          <div style="font-size:22px;font-weight:600;letter-spacing:-0.5px" x-text="countByStatus(s.key)"></div>
          <div style="font-size:12px;color:#78776E;margin-top:2px" x-text="s.label"></div>
        </button>
      </template>
    </div>

    <!-- Filter bar -->
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap">
      <template x-for="s in allStatuses" :key="s.key">
        <button @click="filter=s.key"
          :style="filter===s.key ? 'background:#1A1917;color:#fff;border-color:#1A1917' : ''"
          class="btn btn-secondary btn-sm"
          x-text="s.label">
        </button>
      </template>
      <div style="margin-left:auto">
        <select x-model="priorityFilter" class="input" style="width:auto;font-size:12.5px;padding:5px 28px 5px 10px">
          <option value="">All priorities</option>
          <option value="urgent">Urgent</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
    </div>

    <!-- Task list -->
    <div style="display:flex;flex-direction:column;gap:6px">
      <template x-if="filteredTasks.length===0">
        <div class="card" style="text-align:center;padding:48px;color:#ABAAA5">
          <p style="font-size:14px">No tasks here.</p>
        </div>
      </template>
      <template x-for="task in filteredTasks" :key="task.id">
        <div class="card" style="display:flex;align-items:flex-start;gap:12px;padding:14px 16px;transition:box-shadow .12s"
             onmouseover="this.style.boxShadow='0 2px 8px rgba(0,0,0,.07)'"
             onmouseout="this.style.boxShadow=''">
          <button @click="toggleDone(task)"
            :title="task.status === 'done' ? 'Mark as todo' : 'Mark as done'"
            class="task-checkbox"
            :class="task.status === 'done' ? 'task-checkbox--done' : ''">
            <svg width="9" height="7" viewBox="0 0 9 7" fill="none" xmlns="http://www.w3.org/2000/svg" class="task-checkbox__check">
              <path d="M1 3.5L3.2 5.5L8 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <span style="font-size:14px;font-weight:500"
                :style="task.status==='done' ? 'text-decoration:line-through;color:#ABAAA5' : 'color:#1A1917'"
                x-text="task.title"></span>
              <span x-html="priorityBadge(task.priority)"></span>
              <template x-if="task.tags && task.tags.length">
                <template x-for="tag in task.tags" :key="tag">
                  <span style="font-size:11.5px;background:#F3F4F6;color:#6B7280;padding:2px 8px;border-radius:999px" x-text="tag"></span>
                </template>
              </template>
            </div>
            <template x-if="task.description">
              <p style="font-size:12.5px;color:#78776E;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="task.description"></p>
            </template>
            <div style="display:flex;gap:14px;margin-top:4px;font-size:12px;color:#ABAAA5">
              <template x-if="task.due_date">
                <span>Due <span x-text="fmtDatetime(task.due_date)"></span></span>
              </template>
              <template x-if="task.reminder_at">
                <span>⏰ <span x-text="fmtDatetime(task.reminder_at)"></span></span>
              </template>
            </div>
          </div>
          <div style="display:flex;gap:4px;flex-shrink:0;opacity:0;transition:opacity .12s"
               onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0'"
               x-show="true"
               class="task-actions">
            <button @click="openEdit(task)" class="btn btn-ghost btn-sm" title="Edit" style="padding:4px 8px">✏️</button>
            <button @click="deleteTask(task.id)" class="btn btn-ghost btn-sm" title="Delete" style="padding:4px 8px;color:#DC2626">🗑</button>
          </div>
        </div>
      </template>
    </div>
  </main>
</div>

<!-- Create / Edit Modal -->
<div x-show="form.open" x-cloak class="modal-backdrop" @click.self="form.open=false">
  <div class="modal-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h2 style="font-size:16px;font-weight:600" x-text="form.id ? 'Edit Task' : 'New Task'"></h2>
      <button @click="form.open=false" class="btn btn-ghost btn-sm">✕</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div>
        <label class="field-label">Title *</label>
        <input x-model="form.title" class="input" placeholder="What needs to be done?" />
      </div>
      <div>
        <label class="field-label">Description</label>
        <textarea x-model="form.description" class="input" rows="2" placeholder="Optional details…"></textarea>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div>
          <label class="field-label">Priority</label>
          <select x-model="form.priority" class="input">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>
        <div>
          <label class="field-label">Status</label>
          <select x-model="form.status" class="input">
            <option value="todo">Todo</option>
            <option value="in_progress">In Progress</option>
            <option value="done">Done</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
      </div>
      <div>
        <label class="field-label">Due date</label>
        <input type="datetime-local" x-model="form.due_date" class="input"
               @change="if(form.due_date && form.due_date.length===10) form.due_date += 'T23:59';
                        else if(form.due_date && form.due_date.endsWith('T00:00')) form.due_date = form.due_date.slice(0,10) + 'T23:59'" />
      </div>
      <div>
        <label class="field-label">Tags (comma-separated)</label>
        <input x-model="form.tagsRaw" class="input" placeholder="work, health, personal" />
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px">
      <button @click="form.open=false" class="btn btn-secondary">Cancel</button>
      <button @click="saveTask()" :disabled="!form.title.trim()" class="btn btn-primary">Save Task</button>
    </div>
  </div>
</div>

<style>
  .card:hover .task-actions { opacity: 1 !important; }

  .task-checkbox {
    flex-shrink: 0;
    margin-top: 1px;
    width: 17px;
    height: 17px;
    border-radius: 5px;
    border: 1.5px solid #C8C7C2;
    background: #fff;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s, background 0.15s;
    color: transparent;
  }
  .task-checkbox:hover {
    border-color: #1A1917;
    background: #F6F5F2;
  }
  .task-checkbox--done {
    border-color: #1A1917;
    background: #1A1917;
    color: #fff;
  }
  .task-checkbox--done:hover {
    border-color: #333228;
    background: #333228;
  }
  .task-checkbox__check {
    display: block;
    flex-shrink: 0;
    transition: opacity 0.1s, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    opacity: 0;
    transform: scale(0.2) rotate(-15deg);
  }
  .task-checkbox--done .task-checkbox__check {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }
</style>

<script src="/static/js/app.js"></script>
<script>
  function tasksApp() {
    return {
      username: '',
      tasks: [],
      filter: 'todo',
      priorityFilter: '',
      form: { open: false, id: null, title: '', description: '', priority: 'medium', status: 'todo', due_date: '', tagsRaw: '' },

      statuses: [
        { key: 'todo',        label: 'Todo',        icon: '⏳' },
        { key: 'in_progress', label: 'In Progress', icon: '🔄' },
        { key: 'done',        label: 'Done',        icon: '✅' },
        { key: 'cancelled',   label: 'Cancelled',   icon: '❌' },
      ],

      get allStatuses() { return [{ key: '', label: 'All' }, ...this.statuses]; },

      get filteredTasks() {
        return this.tasks.filter(t => {
          if (this.filter && t.status !== this.filter) return false;
          if (this.priorityFilter && t.priority !== this.priorityFilter) return false;
          return true;
        });
      },

      countByStatus(s) { return this.tasks.filter(t => t.status === s).length; },
      statusIcon(s) { return { todo: '⏳', in_progress: '🔄', done: '✅', cancelled: '❌' }[s] || '⏳'; },
      priorityBadge(p) { return PRIORITY_BADGE[p] || ''; },

      async init() {
        requireAuth();
        API.get('/users/me').then(u => { this.username = u.username || ''; }).catch(() => {});
        await this.loadTasks();
        window._koko_cmds = [
          { label: 'New Task', icon: '✏️', hint: 'Create', section: 'Actions', action: () => this.openCreate() },
        ];
      },
      async loadTasks() { this.tasks = await API.get('/tasks/'); },

      openCreate() {
        this.form = { open: true, id: null, title: '', description: '', priority: 'medium', status: 'todo', due_date: '', tagsRaw: '' };
      },

      openEdit(task) {
        this.form = {
          open: true, id: task.id, title: task.title,
          description: task.description || '', priority: task.priority,
          status: task.status, due_date: task.due_date ? task.due_date.slice(0,16) : '',
          tagsRaw: (task.tags || []).join(', '),
        };
      },

      async saveTask() {
        if (!this.form.title.trim()) return;
        const payload = {
          title: this.form.title.trim(), description: this.form.description || null,
          priority: this.form.priority, status: this.form.status,
          due_date: this.form.due_date || null,
          tags: this.form.tagsRaw ? this.form.tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [],
        };
        try {
          if (this.form.id) await API.patch(`/tasks/${this.form.id}`, payload);
          else await API.post('/tasks/', payload);
          this.form.open = false;
          await this.loadTasks();
        } catch(e) { alert('Save failed: ' + e.message); }
      },

      async toggleDone(task) {
        const prev = task.status;
        task.status = prev === 'done' ? 'todo' : 'done';
        try {
          await API.patch(`/tasks/${task.id}`, { status: task.status });
        } catch(e) {
          task.status = prev;
        }
      },

      async deleteTask(id) {
        if (!confirm('Delete this task?')) return;
        await API.delete(`/tasks/${id}`);
        await this.loadTasks();
      },

      fmtDate, logout,
    };
  }
</script>
</body>
</html>
