<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koko — Profile</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="profileApp()" x-init="init()">

<div class="page-shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo" x-text="user.username ? 'Hi, ' + user.username + '!' : 'Hi there!'"></div>
    <nav style="display:flex;flex-direction:column;gap:2px">
      <a href="/dashboard" class="nav-link"><span class="nav-icon">📅</span><span class="nav-label">Daily Tracker</span></a>
      <a href="/tasks"     class="nav-link"><span class="nav-icon">✅</span><span class="nav-label">Tasks</span></a>
      <a href="/workout"   class="nav-link"><span class="nav-icon">🏋️</span><span class="nav-label">Workout</span></a>
      <a href="/documents" class="nav-link"><span class="nav-icon">📄</span><span class="nav-label">Documents</span></a>
      <a href="/profile"   class="nav-link active"><span class="nav-icon">👤</span><span class="nav-label">Profile</span></a>
    </nav>
    <div style="flex:1"></div>
    <button @click="logout()" class="nav-link danger"><span class="nav-icon">←</span><span class="nav-label">Sign out</span></button>
  </aside>

  <!-- Main -->
  <main class="page-main">

    <div class="page-header">
      <h1 class="page-title">Profile</h1>
    </div>

    <!-- User info -->
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px">
        <template x-if="user.avatar_url">
          <img :src="user.avatar_url" style="width:52px;height:52px;border-radius:50%;border:2px solid #E8E7E3;object-fit:cover" />
        </template>
        <template x-if="!user.avatar_url">
          <div style="width:52px;height:52px;border-radius:50%;background:#F0EFE9;display:flex;align-items:center;justify-content:center;font-size:22px">👤</div>
        </template>
        <div>
          <p style="font-size:15px;font-weight:600;color:#1A1917" x-text="user.username ? '@' + user.username : 'No username'"></p>
          <p style="font-size:12.5px;color:#ABAAA5;margin-top:2px">Telegram ID: <span x-text="user.telegram_id"></span></p>
        </div>
      </div>
      <div style="margin-bottom:14px">
        <label class="field-label">Timezone</label>
        <select x-model="profile.timezone" class="input" style="max-width:320px">
          <option value="UTC">UTC</option>
          <option value="Asia/Singapore">Asia/Singapore (SGT +8)</option>
          <option value="Asia/Shanghai">Asia/Shanghai (CST +8)</option>
          <option value="Asia/Tokyo">Asia/Tokyo (JST +9)</option>
          <option value="America/New_York">America/New_York (EST)</option>
          <option value="America/Los_Angeles">America/Los_Angeles (PST)</option>
          <option value="Europe/London">Europe/London (GMT)</option>
          <option value="Europe/Berlin">Europe/Berlin (CET)</option>
        </select>
      </div>
      <button @click="saveProfile()" :disabled="saving" class="btn btn-primary btn-sm">
        <span x-text="saving ? 'Saving…' : 'Save'"></span>
      </button>
    </div>

    <!-- AI Context Preferences -->
    <div class="card" style="margin-bottom:16px">
      <div style="margin-bottom:16px">
        <p style="font-size:14px;font-weight:600;color:#1A1917;margin-bottom:4px">AI Context</p>
        <p style="font-size:12.5px;color:#78776E">Facts passed to the AI as context about you.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px">
        <template x-if="Object.keys(editablePrefs).length===0">
          <p style="font-size:13px;color:#ABAAA5;padding:8px 0">No preferences set yet.</p>
        </template>
        <template x-for="(pref, key) in editablePrefs" :key="key">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:13px;color:#78776E;width:120px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="key"></span>
            <input :value="pref" @input="editablePrefs[key]=$event.target.value" class="input" style="flex:1" />
          </div>
        </template>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <input x-model="newPrefKey" class="input" placeholder="Key (e.g. goal)" style="flex:1" />
        <input x-model="newPrefVal" class="input" placeholder="Value" style="flex:1" />
        <button @click="addPref()" class="btn btn-secondary btn-sm">+ Add</button>
      </div>
      <button @click="savePrefs()" :disabled="saving" class="btn btn-primary btn-sm">
        <span x-text="saving ? 'Saving…' : 'Save Preferences'"></span>
      </button>
    </div>

    <!-- Memory -->
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <div>
          <p style="font-size:14px;font-weight:600;color:#1A1917;margin-bottom:3px">Memory</p>
          <p style="font-size:12.5px;color:#78776E">Facts remembered across all conversations.</p>
        </div>
        <button @click="memForm.open=true" class="btn btn-secondary btn-sm">+ Add</button>
      </div>

      <template x-if="memory.length===0">
        <p style="font-size:13px;color:#ABAAA5;text-align:center;padding:20px 0">No memory items yet.</p>
      </template>

      <div>
        <template x-for="item in memory" :key="item.id">
          <div style="padding:10px 0;border-bottom:1px solid #F3F4F6" class="memory-row">

            <!-- View mode -->
            <template x-if="editingId !== item.id">
              <div style="display:flex;align-items:flex-start;gap:10px">
                <span style="font-size:11px;background:#F0EFE9;color:#78776E;padding:2px 8px;border-radius:999px;font-weight:500;margin-top:2px;flex-shrink:0" x-text="item.category"></span>
                <div style="flex:1;min-width:0">
                  <span style="font-size:13.5px;font-weight:500;color:#1A1917" x-text="item.key + ': '"></span>
                  <span style="font-size:13.5px;color:#78776E" x-text="item.value"></span>
                </div>
                <div style="display:flex;gap:4px;flex-shrink:0" class="memory-actions">
                  <button @click="startEdit(item)" class="btn btn-ghost btn-sm" style="color:#78776E;padding:3px 7px" title="Edit">✏️</button>
                  <button @click="deleteMemory(item.id)" class="btn btn-ghost btn-sm" style="color:#DC2626;padding:3px 7px" title="Delete">🗑</button>
                </div>
              </div>
            </template>

            <!-- Edit mode -->
            <template x-if="editingId === item.id">
              <div style="display:flex;flex-direction:column;gap:8px">
                <div style="display:flex;gap:8px;flex-wrap:wrap">
                  <input x-model="editDraft.key" class="input" placeholder="Key" style="flex:1;min-width:120px" />
                  <select x-model="editDraft.category" class="input" style="width:120px">
                    <option value="general">general</option>
                    <option value="preference">preference</option>
                    <option value="fact">fact</option>
                    <option value="note">note</option>
                  </select>
                </div>
                <textarea x-model="editDraft.value" class="input" rows="2" placeholder="Value" style="resize:vertical"></textarea>
                <div style="display:flex;gap:6px;justify-content:flex-end">
                  <button @click="cancelEdit()" class="btn btn-secondary btn-sm">Cancel</button>
                  <button @click="saveEdit(item.id)" :disabled="savingEdit" class="btn btn-primary btn-sm">
                    <span x-text="savingEdit ? 'Saving…' : 'Save'"></span>
                  </button>
                </div>
              </div>
            </template>

          </div>
        </template>
      </div>
    </div>

  </main>
</div>

<!-- Add Memory Modal -->
<div x-show="memForm.open" x-cloak class="modal-backdrop" @click.self="memForm.open=false">
  <div class="modal-panel" style="max-width:380px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h2 style="font-size:16px;font-weight:600">Add Memory</h2>
      <button @click="memForm.open=false" class="btn btn-ghost btn-sm">✕</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div>
        <label class="field-label">Key</label>
        <input x-model="memForm.key" class="input" placeholder="e.g. allergies" />
      </div>
      <div>
        <label class="field-label">Value</label>
        <textarea x-model="memForm.value" class="input" rows="3" placeholder="What should Koko remember?"></textarea>
      </div>
      <div>
        <label class="field-label">Category</label>
        <select x-model="memForm.category" class="input">
          <option value="general">general</option>
          <option value="preference">preference</option>
          <option value="fact">fact</option>
          <option value="note">note</option>
        </select>
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px">
      <button @click="memForm.open=false" class="btn btn-secondary">Cancel</button>
      <button @click="saveMemory()" class="btn btn-primary">Save</button>
    </div>
  </div>
</div>

<style>
  .memory-row:last-child { border-bottom: none; }
  .memory-actions { opacity: 0; transition: opacity .12s; }
  .memory-row:hover .memory-actions { opacity: 1; }
</style>

<script src="/static/js/app.js"></script>
<script>
  function profileApp() {
    return {
      user: {}, profile: { timezone: 'UTC' },
      editablePrefs: {}, newPrefKey: '', newPrefVal: '',
      memory: [], saving: false, savingEdit: false,
      editingId: null, editDraft: { key: '', value: '', category: 'general' },
      memForm: { open: false, key: '', value: '', category: 'general' },

      async init() {
        requireAuth();
        const u = await API.get('/users/me');
        this.user = u;
        this.profile.timezone = u.timezone;
        this.editablePrefs = { ...(u.preferences || {}) };
        await this.loadMemory();
      },

      async saveProfile() {
        this.saving = true;
        try { await API.patch('/users/me', { timezone: this.profile.timezone }); }
        catch(e) { alert(e.message); }
        this.saving = false;
      },

      addPref() {
        if (!this.newPrefKey.trim()) return;
        this.editablePrefs[this.newPrefKey.trim()] = this.newPrefVal;
        this.newPrefKey = ''; this.newPrefVal = '';
      },

      async savePrefs() {
        this.saving = true;
        try { await API.patch('/users/me', { preferences: this.editablePrefs }); }
        catch(e) { alert(e.message); }
        this.saving = false;
      },

      async loadMemory() { this.memory = await API.get('/memory/'); },

      async saveMemory() {
        if (!this.memForm.key.trim() || !this.memForm.value.trim()) return;
        await API.post('/memory/', {
          key: this.memForm.key.trim(), value: this.memForm.value.trim(),
          category: this.memForm.category,
        });
        this.memForm = { open: false, key: '', value: '', category: 'general' };
        await this.loadMemory();
      },

      startEdit(item) {
        this.editingId = item.id;
        this.editDraft = { key: item.key, value: item.value, category: item.category };
      },

      cancelEdit() {
        this.editingId = null;
      },

      async saveEdit(id) {
        if (!this.editDraft.key.trim() || !this.editDraft.value.trim()) return;
        this.savingEdit = true;
        try {
          await API.patch(`/memory/${id}`, {
            key: this.editDraft.key.trim(),
            value: this.editDraft.value.trim(),
            category: this.editDraft.category,
          });
          this.editingId = null;
          await this.loadMemory();
        } catch(e) { alert(e.message); }
        this.savingEdit = false;
      },

      async deleteMemory(id) {
        if (!confirm('Remove this memory?')) return;
        await API.delete(`/memory/${id}`);
        if (this.editingId === id) this.editingId = null;
        await this.loadMemory();
      },

      logout,
    };
  }
</script>
</body>
</html>
