<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koko — Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="bg-gray-50 min-h-screen" x-data="profileApp()" x-init="init()">

  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-56 bg-white border-r border-gray-100 flex flex-col p-4 gap-1 shrink-0">
      <div class="text-xl font-bold text-indigo-600 mb-6 px-2">🪄 Koko</div>
      <a href="/dashboard" class="nav-link">📅 Daily Tracker</a>
      <a href="/tasks"     class="nav-link">✅ Tasks</a>
      <a href="/documents" class="nav-link">📄 Documents</a>
      <a href="/profile"   class="nav-link active">👤 Profile</a>
      <div class="flex-1"></div>
      <button @click="logout()" class="nav-link text-red-500 hover:bg-red-50 hover:text-red-600">🚪 Logout</button>
    </aside>

    <!-- Main -->
    <main class="flex-1 overflow-y-auto p-6 max-w-3xl">
      <h1 class="text-2xl font-bold text-gray-900 mb-6">Profile & Preferences</h1>

      <!-- User info card -->
      <div class="card mb-6">
        <div class="flex items-center gap-4 mb-4">
          <template x-if="user.avatar_url">
            <img :src="user.avatar_url" class="w-14 h-14 rounded-full border-2 border-indigo-200" />
          </template>
          <template x-if="!user.avatar_url">
            <div class="w-14 h-14 rounded-full bg-indigo-100 flex items-center justify-center text-2xl">👤</div>
          </template>
          <div>
            <p class="font-semibold text-gray-900" x-text="user.username ? '@' + user.username : 'No username'"></p>
            <p class="text-sm text-gray-400">Telegram ID: <span x-text="user.telegram_id"></span></p>
          </div>
        </div>

        <div class="space-y-3">
          <div>
            <label class="text-xs text-gray-500 block mb-1">Timezone</label>
            <select x-model="profile.timezone"
              class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
              <option value="UTC">UTC</option>
              <option value="Asia/Singapore">Asia/Singapore (SGT)</option>
              <option value="Asia/Shanghai">Asia/Shanghai (CST)</option>
              <option value="Asia/Tokyo">Asia/Tokyo (JST)</option>
              <option value="America/New_York">America/New_York (EST)</option>
              <option value="America/Los_Angeles">America/Los_Angeles (PST)</option>
              <option value="Europe/London">Europe/London (GMT)</option>
              <option value="Europe/Berlin">Europe/Berlin (CET)</option>
            </select>
          </div>
        </div>
        <button @click="saveProfile()" :disabled="saving"
          class="mt-4 bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 disabled:opacity-50">
          <span x-text="saving ? 'Saving…' : 'Save Profile'"></span>
        </button>
      </div>

      <!-- Preferences (passed to AI as context) -->
      <div class="card mb-6">
        <h2 class="font-semibold text-gray-700 mb-3">AI Context Preferences</h2>
        <p class="text-xs text-gray-400 mb-3">These are passed to the AI assistant as context about you.</p>
        <div class="space-y-3">
          <template x-for="(pref, key) in editablePrefs" :key="key">
            <div class="flex items-center gap-2">
              <span class="text-sm text-gray-500 w-32 shrink-0" x-text="key"></span>
              <input :value="pref" @input="editablePrefs[key] = $event.target.value"
                class="flex-1 border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
            </div>
          </template>
        </div>
        <div class="flex gap-2 mt-3">
          <input x-model="newPrefKey" placeholder="Key (e.g. goal)"
            class="border border-gray-200 rounded-lg px-3 py-1.5 text-sm flex-1 focus:outline-none focus:ring-2 focus:ring-indigo-400" />
          <input x-model="newPrefVal" placeholder="Value"
            class="border border-gray-200 rounded-lg px-3 py-1.5 text-sm flex-1 focus:outline-none focus:ring-2 focus:ring-indigo-400" />
          <button @click="addPref()"
            class="bg-gray-100 text-gray-700 px-3 py-1.5 rounded-lg text-sm hover:bg-gray-200">+</button>
        </div>
        <button @click="savePrefs()" :disabled="saving"
          class="mt-3 bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 disabled:opacity-50">
          Save Preferences
        </button>
      </div>

      <!-- Memory items -->
      <div class="card">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-semibold text-gray-700">Memory</h2>
          <button @click="memForm.open = true"
            class="text-xs bg-indigo-50 text-indigo-600 px-3 py-1 rounded-lg hover:bg-indigo-100">+ Add</button>
        </div>
        <p class="text-xs text-gray-400 mb-3">Facts and preferences remembered across conversations.</p>

        <div class="space-y-2">
          <template x-if="memory.length === 0">
            <p class="text-gray-400 text-sm text-center py-4">No memory items yet.</p>
          </template>
          <template x-for="item in memory" :key="item.id">
            <div class="flex items-start gap-2 py-1.5 border-b border-gray-50 last:border-0 group">
              <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full mt-0.5 shrink-0"
                    x-text="item.category"></span>
              <div class="flex-1 min-w-0">
                <span class="text-sm font-medium text-gray-700" x-text="item.key + ': '"></span>
                <span class="text-sm text-gray-600" x-text="item.value"></span>
              </div>
              <button @click="deleteMemory(item.id)"
                class="text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all p-1 shrink-0">🗑️</button>
            </div>
          </template>
        </div>
      </div>
    </main>
  </div>

  <!-- Add Memory Modal -->
  <div x-show="memForm.open" x-cloak class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4"
       @click.self="memForm.open = false">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6">
      <h2 class="text-lg font-bold mb-4">Add Memory</h2>
      <div class="space-y-3">
        <input x-model="memForm.key" placeholder="Key (e.g. allergies)"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        <textarea x-model="memForm.value" placeholder="Value" rows="3"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 resize-none"></textarea>
        <select x-model="memForm.category"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
          <option value="general">general</option>
          <option value="preference">preference</option>
          <option value="fact">fact</option>
          <option value="note">note</option>
        </select>
      </div>
      <div class="flex justify-end gap-2 mt-4">
        <button @click="memForm.open = false" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg">Cancel</button>
        <button @click="saveMemory()" class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium">Save</button>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  <script>
    function profileApp() {
      return {
        user: {},
        profile: { timezone: 'UTC' },
        editablePrefs: {},
        newPrefKey: '',
        newPrefVal: '',
        memory: [],
        saving: false,
        memForm: { open: false, key: '', value: '', category: 'general' },

        async init() {
          requireAuth();
          const u = await API.get('/users/me');
          this.user = u;
          this.profile.timezone = u.timezone;
          this.editablePrefs = { ...(u.preferences || {}) };
          await this.loadMemory();
        },

        async saveProfile() {
          this.saving = true;
          try {
            await API.patch('/users/me', { timezone: this.profile.timezone });
          } catch (e) { alert(e.message); }
          this.saving = false;
        },

        addPref() {
          if (!this.newPrefKey.trim()) return;
          this.editablePrefs[this.newPrefKey.trim()] = this.newPrefVal;
          this.newPrefKey = '';
          this.newPrefVal = '';
        },

        async savePrefs() {
          this.saving = true;
          try {
            await API.patch('/users/me', { preferences: this.editablePrefs });
          } catch (e) { alert(e.message); }
          this.saving = false;
        },

        async loadMemory() {
          this.memory = await API.get('/memory/');
        },

        async saveMemory() {
          if (!this.memForm.key.trim() || !this.memForm.value.trim()) return;
          await API.post('/memory/', {
            key: this.memForm.key.trim(),
            value: this.memForm.value.trim(),
            category: this.memForm.category,
          });
          this.memForm = { open: false, key: '', value: '', category: 'general' };
          await this.loadMemory();
        },

        async deleteMemory(id) {
          if (!confirm('Remove this memory?')) return;
          await API.delete(`/memory/${id}`);
          await this.loadMemory();
        },

        logout,
      };
    }
  </script>
</body>
</html>
